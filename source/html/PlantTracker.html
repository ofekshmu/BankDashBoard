<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מעקב עציצים</title>
<style>
:root {
  --teal:       #1e9d8b;
  --teal-light: #e8f7f5;
  --teal-dark:  #178878;
  --teal-glow:  rgba(30,157,139,.28);
  --navy:       #1e2a4a;
  --bg:         #f4f6f9;
  --white:      #ffffff;
  --border:     #eef0f6;
  --text-muted: #888;
  --text-sub:   #555;
  --red:        #e74c3c;
  --amber:      #f0b429;
  --green:      #2ecc71;
  --shadow-sm:  0 2px 10px rgba(0,0,0,.06);
  --shadow-md:  0 6px 20px rgba(0,0,0,.10);
  --radius:     14px;
  --radius-sm:  8px;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  direction: rtl;
  color: var(--navy);
  font-size: 14px;
  display: flex;
  flex-direction: column;
}

/* ── Hamburger + slide-in nav ─────────────────────────────── */
.ham-btn {
  position: fixed; top: 18px; right: 18px;
  width: 42px; height: 42px;
  background: var(--white); border: 1.5px solid var(--border);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--navy); z-index: 400;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
  transition: background .15s, color .15s, border-color .15s;
}
.ham-btn:hover { background: var(--teal-light); color: var(--teal); }
.nav-overlay {
  position: fixed; inset: 0;
  background: rgba(15,22,45,.26);
  z-index: 1000; opacity: 0; pointer-events: none;
  transition: opacity .22s ease;
}
.nav-overlay.open { opacity: 1; pointer-events: all; }
.sidebar {
  position: fixed; top: 0; right: 0;
  height: 100vh; width: 230px;
  background: var(--white); z-index: 1002;
  transform: translate3d(100%, 0, 0);
  transition: transform .22s cubic-bezier(.4,0,.2,1);
  will-change: transform;
  box-shadow: -4px 0 24px rgba(0,0,0,.09);
  display: flex; flex-direction: column;
}
.sidebar.open { transform: translate3d(0, 0, 0); }
.sidebar-header {
  display: flex; align-items: center;
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sidebar-app-name { font-size: .95em; font-weight: 700; color: var(--navy); }
.sidebar-close-btn {
  margin-right: auto; background: none; border: none;
  cursor: pointer; font-size: 1.1em; color: var(--text-sub);
  line-height: 1; padding: 4px 6px; border-radius: 6px;
  transition: background .12s, color .12s;
}
.sidebar-close-btn:hover { background: var(--teal-light); color: var(--teal); }
.sidebar-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 0 16px; }
.sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
.nav-restart-btn {
  width: 100%; padding: 8px 12px;
  border: 1.5px dashed var(--border); border-radius: 8px;
  background: none; color: var(--text-muted);
  font-size: .78em; font-weight: 600; cursor: pointer;
  font-family: inherit; display: flex; align-items: center;
  gap: 7px; justify-content: center;
  transition: background .15s, color .15s, border-color .15s;
}
.nav-restart-btn:hover { background: #fff3f3; color: #e53935; border-color: #e53935; }
.nav-restart-btn:disabled { opacity: .5; cursor: default; }
.nav-item {
  display: flex; align-items: center; padding: 10px 20px;
  text-decoration: none; color: var(--text-sub);
  font-size: .875em; font-weight: 500;
  transition: background .1s, color .1s;
  cursor: pointer; border: none; background: none;
  width: 100%; text-align: right;
  position: relative; letter-spacing: .1px; font-family: inherit;
}
.nav-item::before {
  content: ''; position: absolute; right: 0; top: 22%; height: 56%;
  width: 3px; border-radius: 3px 0 0 3px;
  background: transparent; transition: background .1s;
}
.nav-item:hover { background: var(--teal-light); color: var(--teal); }
.nav-item:hover::before { background: var(--teal); }
.nav-item.active { color: #b8c0d0; cursor: default; pointer-events: none; }
.nav-sep { height: 1px; background: var(--border); margin: 8px 16px; }

/* ── Page layout ──────────────────────────────────────────── */
.page-wrap { flex: 1; display: flex; flex-direction: column; padding-bottom: 60px; }

/* ── Page header ──────────────────────────────────────────── */
.page-header {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 14px 6px 10px;
  padding-right: 68px;
  border-bottom: 1.5px solid var(--border);
  flex-shrink: 0; background: var(--white);
}
.page-title { font-size: 1em; font-weight: 700; }
.spacer { flex: 1; }

/* ── Buttons ──────────────────────────────────────────────── */
.btn {
  padding: 7px 14px; border: none; border-radius: 8px;
  cursor: pointer; font-size: 0.82em; font-weight: 600;
  font-family: inherit;
  transition: background .13s, transform .08s, box-shadow .13s;
  display: inline-flex; align-items: center; gap: 5px;
}
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--teal); color: #fff; }
.btn-primary:hover { background: var(--teal-dark); }
.btn-ghost {
  background: none; color: var(--navy);
  border: 1.5px solid var(--border);
}
.btn-ghost:hover { border-color: var(--teal); color: var(--teal); background: var(--teal-light); }
.btn-sm { padding: 5px 11px; font-size: .8em; }
.btn-xs { padding: 4px 9px; font-size: .77em; }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { background: #c0392b; }
/* ── Modals ───────────────────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(15,22,45,.38);
  z-index: 600; display: none;
  align-items: center; justify-content: center;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--white); border-radius: var(--radius);
  box-shadow: 0 16px 48px rgba(0,0,0,.18);
  padding: 28px 28px 24px;
  width: 460px; max-width: calc(100vw - 32px);
  max-height: 90vh; overflow-y: auto;
  direction: rtl; position: relative;
}
.modal-wide { width: 640px; }
.modal-title { font-size: 1.05em; font-weight: 700; margin-bottom: 20px; }
.modal-close-btn {
  position: absolute; top: 16px; left: 18px;
  background: none; border: none; cursor: pointer;
  font-size: 1.1em; color: var(--text-muted);
  padding: 4px 6px; border-radius: 6px;
  transition: background .12s, color .12s;
}
.modal-close-btn:hover { background: var(--teal-light); color: var(--teal); }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
.field-row { margin-bottom: 14px; }
.field-label {
  font-size: .72em; font-weight: 700; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px; display: block;
}
.field-input {
  width: 100%; padding: 9px 13px; box-sizing: border-box; height: 38px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-size: .88em; color: var(--navy); background: var(--white);
  outline: none; font-family: inherit; direction: rtl;
  transition: border-color .18s, box-shadow .18s;
}
.field-input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(30,157,139,.12); }
input[type="date"].field-input { padding: 0 10px; appearance: none; -webkit-appearance: none; }
.debug-fab{position:fixed;bottom:22px;right:18px;width:42px;height:42px;border-radius:50%;background:#1e2a4a;color:#fff;font-size:.72em;font-family:monospace;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:997;letter-spacing:-.5px}
.debug-fab:hover{filter:brightness(1.2)}
.debug-panel{position:fixed;bottom:72px;right:16px;width:480px;max-width:calc(100vw - 32px);height:340px;background:#12121f;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.55);z-index:996;display:none;flex-direction:column;overflow:hidden;font-family:monospace}
.debug-panel.open{display:flex}
.debug-hdr{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:#0a0a18;color:#7ec8e3;font-size:.7em;font-weight:700;letter-spacing:.06em;flex-shrink:0;border-bottom:1px solid #222}
.debug-hdr-btns{display:flex;gap:5px}
.debug-hdr-btns button{background:none;border:1px solid #333;color:#888;border-radius:4px;padding:2px 8px;font-size:.9em;cursor:pointer;font-family:monospace}
.debug-hdr-btns button:hover{background:#1e1e2e;color:#eee}
.debug-feed{flex:1;overflow-y:auto;padding:6px 10px;font-size:.68em;line-height:1.55;color:#c8d8e4}
.debug-line{white-space:pre-wrap;word-break:break-all;padding:1px 0;border-bottom:1px solid #1a1a2a}
.debug-line.err{color:#ff6b6b}
.debug-line.warn{color:#ffa94d}

/* ── Plant tracker ─────────────────────────────────────────── */
.pt-main { width: 100%; max-width: 1100px; margin: 0 auto; padding: 18px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
.pt-card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 16px 18px; }
.pt-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.pt-stat { display: flex; align-items: baseline; gap: 6px; padding: 8px 14px; border-radius: 10px; background: var(--bg); font-size: .85em; color: var(--text-sub); }
.pt-stat b { font-size: 1.35em; color: var(--navy); }
.pt-stat.due b { color: var(--teal); }
.pt-stat.overdue b { color: var(--red); }
.pt-stat.pending b { color: var(--amber); }
.pt-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .74em; color: var(--text-muted); margin-top: 10px; }
.pt-legend span { display: inline-flex; align-items: center; gap: 4px; }
.pt-swatch { width: 12px; height: 6px; border-radius: 3px; display: inline-block; }
.pt-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.pt-sugg { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 9px 12px; border-radius: 10px; border-right: 4px solid var(--teal); background: var(--teal-light); font-size: .84em; }
.pt-sugg.warn { border-color: var(--amber); background: #fff8e6; }
.pt-sugg.alert { border-color: var(--red); background: #fdeeee; }
.pt-sugg-text { flex: 1; min-width: 180px; }
.pt-sugg-btns { display: flex; gap: 6px; flex-shrink: 0; }
.pt-empty { text-align: center; color: var(--text-muted); padding: 40px 10px; font-size: .9em; }
.pt-rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.pt-room-head { grid-column: 1 / -1; }
.pt-pcard { background: var(--white); border: 1.5px solid var(--border); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-sm); min-width: 0; }
.pt-plant { display: flex; align-items: center; gap: 10px; width: 100%; cursor: pointer; border: none; background: none; font-family: inherit; text-align: right; padding: 0; color: inherit; }
.pt-plant svg { flex-shrink: 0; }
.pt-plant > div { flex: 1; min-width: 0; }
.pt-plant-name { font-weight: 700; font-size: .95em; }
.pt-plant-meta { font-size: .72em; color: var(--text-muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pt-pill { flex-shrink: 0; padding: 3px 10px; border-radius: 20px; font-size: .72em; font-weight: 700; white-space: nowrap; background: var(--bg); color: var(--text-sub); }
.pt-pill.ok { background: var(--teal-light); color: var(--teal-dark); }
.pt-pill.due { background: #fff8e6; color: #9a6b00; }
.pt-pill.overdue { background: #fdeeee; color: #c0392b; }
.pt-pill.auto { background: #e8f0fb; color: #2f6fb0; }
.pt-cells { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; }
.pt-cell { min-width: 0; height: 58px; border-radius: 8px; border: 1px solid transparent; background: var(--bg); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0 0; cursor: pointer; font-family: inherit; overflow: hidden; color: var(--navy); }
.pt-cell:hover { border-color: var(--teal); }
.pt-cell.today { background: var(--teal-light); border-color: var(--teal); }
.pt-cell.blank { cursor: default; opacity: .4; }
.pt-cell-date { font-size: .62em; color: var(--text-muted); line-height: 1.15; text-align: center; }
.pt-cell-date b { display: block; font-weight: 600; color: var(--text-sub); }
.pt-marks { display: flex; gap: 2px; height: 4px; }
.pt-mark { width: 4px; height: 4px; border-radius: 50%; }
.pt-soil { width: 70%; height: 4px; border-radius: 2px; background: #dfe3ea; margin-top: auto; margin-bottom: 5px; }
.pt-soil.dry { background: #d8b47a; }
.pt-soil.humid { background: #8fd3c7; }
.pt-soil.wet { background: #2f6fb0; }
.pt-drop { width: 12px; height: 14px; }
.pt-drop.watered path { fill: #2f8fd8; stroke: #2f8fd8; }
.pt-drop.expected path { fill: none; stroke: #2f8fd8; stroke-dasharray: 2 2; }
.pt-drop.none path { fill: none; stroke: #c9ced8; }
.pt-tips { display: flex; flex-direction: column; gap: 6px; }
.pt-tips .pt-sugg { padding: 7px 10px; font-size: .8em; }
.pt-fab { position: fixed; bottom: 22px; left: 18px; z-index: 900; display: flex; align-items: center; gap: 7px; padding: 10px 16px; border-radius: 24px; border: 1.5px solid var(--teal); background: var(--teal); color: #fff; font-family: inherit; font-weight: 700; font-size: .85em; box-shadow: var(--shadow-md); cursor: pointer; }
.pt-fab b { background: rgba(255,255,255,.25); border-radius: 10px; padding: 0 7px; }
.pt-fab.off { background: var(--white); color: var(--teal); }
.pt-fab.off b { background: var(--teal-light); }
.pt-seg { display: flex; gap: 6px; flex-wrap: wrap; }
.pt-seg button { flex: 1; min-width: 64px; padding: 8px 6px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--white); cursor: pointer; font-family: inherit; font-size: .82em; color: var(--navy); }
.pt-seg button.on { border-color: var(--teal); background: var(--teal-light); color: var(--teal); font-weight: 700; }
.pt-types { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; max-height: 248px; overflow-y: auto; padding: 2px; }
.pt-types button { border: 2px solid transparent; border-radius: 12px; background: var(--bg); padding: 6px 2px 4px; cursor: pointer; font-family: inherit; font-size: .7em; color: var(--text-sub); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.pt-types button.on { border-color: var(--teal); background: var(--teal-light); }
.pt-colors { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pt-colors button { width: 26px; height: 26px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
.pt-colors button.on { border-color: var(--navy); }
.pt-colors input[type="color"] { width: 30px; height: 30px; border: none; background: none; cursor: pointer; padding: 0; }
.pt-inline { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.pt-inline .field-input { flex: 1; min-width: 120px; }
.pt-evlist { display: flex; flex-direction: column; gap: 6px; }
.pt-ev { display: flex; align-items: center; gap: 8px; font-size: .82em; padding: 6px 10px; border-radius: 8px; background: var(--bg); }
.pt-ev span { flex: 1; }
.pt-ev button { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1em; }
.pt-ev button:hover { color: var(--red); }
.pt-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--navy); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: .85em; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 2000; max-width: calc(100vw - 32px); }
.pt-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.pt-toast.err { background: var(--red); }
.pt-toast.ok { background: var(--teal-dark); }
.btn.dirty { background: var(--amber); border-color: var(--amber); color: var(--navy); box-shadow: 0 0 0 3px rgba(240,180,41,.25); }
.pt-unsaved { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: #fff8e6; border: 1.5px solid var(--amber); border-radius: 10px; padding: 10px 12px; margin: 22px 0 14px; font-size: .85em; font-weight: 600; color: #7a5600; }
.pt-unsaved span { flex: 1 0 100%; }
.pt-pcard.pending { opacity: .65; pointer-events: none; }
.pt-arch-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.pt-arch-row > div { flex: 1; min-width: 0; }
.pt-arch-row svg { filter: grayscale(.85); opacity: .8; flex-shrink: 0; }
.pt-arch-note { font-size: .78em; color: var(--text-sub); margin-top: 3px; }
.pt-restore-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .88em; }
.pt-restore-row span { flex: 1; }
.pt-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.pt-chips:empty { display: none; }
.pt-chip { border: 1.5px solid var(--border); background: var(--white); border-radius: 20px; padding: 5px 12px; font-size: .8em; cursor: pointer; font-family: inherit; color: var(--text-sub); display: inline-flex; gap: 6px; align-items: center; }
.pt-chip b { color: var(--text-muted); font-size: .9em; }
.pt-chip.on { border-color: var(--teal); background: var(--teal-light); color: var(--teal); font-weight: 700; }
.pt-room-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .88em; color: var(--navy); padding: 4px 0; border-bottom: 1.5px solid var(--border); margin-top: 6px; }
.pt-room-head:first-child { margin-top: 0; }
.pt-room-count { background: var(--bg); color: var(--text-muted); border-radius: 20px; padding: 0 8px; font-size: .85em; font-weight: 600; }
.pt-room-row { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
.pt-room-row .field-input { flex: 1; min-width: 0; }
.pt-cfg-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.pt-cfg-row > div { flex: 1; min-width: 0; }
.pt-cfg-name { font-weight: 700; font-size: .9em; }
.pt-days { display: flex; gap: 5px; flex-wrap: wrap; }
.pt-days button { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--white); cursor: pointer; font-family: inherit; font-size: .85em; color: var(--navy); }
.pt-days button.on { border-color: var(--teal); background: var(--teal); color: #fff; font-weight: 700; }
.pt-pick { max-height: 220px; overflow-y: auto; border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 4px 8px; }
.pt-pick label { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: .85em; cursor: pointer; }
.pt-pick label small { color: var(--text-muted); margin-right: auto; }
@media (max-width: 720px) {
  .pt-main { padding: 14px 16px 40px; }
  .pt-rows { grid-template-columns: minmax(0, 1fr); }
  .page-header { flex-wrap: wrap; row-gap: 6px; }
  .page-header .btn { white-space: nowrap; }
  .pt-pcard { padding: 12px; }
  .pt-types { grid-template-columns: repeat(4, 1fr); }
}
</style>

function restartServer(btn) {
  btn.disabled = true;
  var spinSvg = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>';
  btn.innerHTML = spinSvg + ' מאתחל…';

  // Step 1: capture current server's startup timestamp
  fetch('/api/status', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(s){ return s.started_at || 0; })
    .catch(function(){ return 0; })
    .then(function(oldTs){
      // Step 2: send restart
      fetch('/api/restart', {method:'POST'}).catch(function(){});
      btn.innerHTML = spinSvg + ' מפעיל מחדש…';

      // Step 3: poll until started_at changes (new process) or timeout
      var deadline = Date.now() + 30000;
      var t = setInterval(function(){
        if(Date.now() > deadline){
          clearInterval(t);
          btn.disabled = false;
          btn.innerHTML = spinSvg + ' נסה שוב';
          return;
        }
        fetch('/api/status', {cache:'no-store'})
          .then(function(r){ return r.json(); })
          .then(function(s){
            if(s.started_at && s.started_at !== oldTs){
              clearInterval(t);
              location.reload();
            }
          })
          .catch(function(){}); // server still down — keep waiting
      }, 700);
    });
}

}
function toggleNav(){

}

function localDate(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function localDateTime(d){ return localDate(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function parseDay(s){ var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
  });
}
function fmtDay(s){ var d = parseDay(s); return 'יום ' + WEEKDAYS[d.getDay()] + "' " + d.getDate() + '/' + (d.getMonth() + 1); }
function toast(msg, isErr){
  var t = document.getElementById('pt-toast');
  t.textContent = msg;
  t.className = 'pt-toast show ' + (isErr ? 'err' : 'ok');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.className = 'pt-toast'; }, 2600);
}
// Esc: every open popup closes, but an edit popup with unsaved changes asks first.
function closeAllModals(){ document.querySelectorAll('.modal-backdrop.open').forEach(function(m){ requestLeave(m.id); }); }
function closeModal(id){
  var m = document.getElementById(id);
  m.classList.remove('open');
  var bar = m.querySelector('.pt-unsaved');
  if (bar) bar.remove();
}
function openModal(id){ document.getElementById(id).classList.add('open'); }
function isOpen(id){ return document.getElementById(id).classList.contains('open'); }

function plantIcon(type, color, name, size){
  var initial = esc(String(name || '?').trim().charAt(0) || '?');
  return '<svg viewBox="0 0 48 48" width="' + size + '" height="' + size + '" aria-hidden="true">' +
    '<rect x="1" y="1" width="46" height="46" rx="13" fill="' + esc(color) + '"/>' +
    '<g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + (GLYPHS[type] || GLYPHS.sprout) + '</g>' +
    '<circle cx="40" cy="40" r="7" fill="#fff"/>' +
    '<text x="40" y="43.5" text-anchor="middle" font-size="10" font-weight="700" font-family="Segoe UI, Arial" fill="' + esc(color) + '">' + initial + '</text></svg>';
}

// ── Data + once-a-day cache ────────────────────────────────────
var CACHE_KEY = 'plants_cache_v2';
var TODAY = localDate(new Date());
var state = null;

function readCache(){
  try {
    var c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    return c && c.date === TODAY ? c.payload : null;
  } catch (_) { return null; }
}
function writeCache(p){ try { localStorage.setItem(CACHE_KEY, JSON.stringify({date: TODAY, payload: p})); } catch (_) {} }

// POST/PUT/DELETE/GET one request; resolves to the JSON payload, rejects with the server's message.
function send(method, url, body){
  // A tab left visible past midnight must send the new date, not the one it loaded with.
  var now = localDate(new Date());
  if (now !== TODAY) TODAY = now;
  var opts = {method: method, headers: {'Content-Type': 'application/json'}};
  if (method === 'GET') url += (url.indexOf('?') < 0 ? '?' : '&') + 'today=' + TODAY;
  else opts.body = JSON.stringify(Object.assign({today: TODAY}, body || {}));
  return fetch(url, opts)
    .then(function(r){ return r.json().catch(function(){ return {ok: false, error: 'שגיאת שרת'}; }); })
    .then(function(d){ if (!d.ok) throw new Error(d.error || 'שגיאה'); return d; });
}
function adopt(d){ if (d && d.plants && d.summary) { state = d; writeCache(d); render(); } }
// Reads (and the initial load): resolves to the response, or null after an error toast.
function api(method, url, body){
  return send(method, url, body).then(function(d){ adopt(d); return d; })
    .catch(function(e){ toast(e.message || 'שגיאת רשת', true); return null; });
}

// ── Optimistic writes ──────────────────────────────────────────
// The page changes the moment you click; the request follows in the background, one at a time
// in click order. When the last queued request answers, the server's full payload replaces the
// local guess (bringing summary and suggestions up to date) and a small "✓" message appears.
// A failure shows "✗ …" and reloads the real state, so nothing unsaved stays on screen.
var writeQueue = Promise.resolve(), pendingWrites = 0, tempSeq = -1;
function mutate(method, url, body, optimistic, okMsg){
  if (optimistic) {
    try { optimistic(state); } catch (e) { console.error(e); }
    recountSummary(state);
    render();
  }
  pendingWrites++;
  var req = writeQueue.then(function(){ return send(method, url, body); });
  writeQueue = req.then(function(){}, function(){});
  return req.then(function(d){
    pendingWrites--;
    if (!pendingWrites) adopt(d);
    toast('✓ ' + (okMsg || 'נשמר'));
    return d;
  }, function(e){
    pendingWrites--;
    toast('✗ לא נשמר — ' + (e.message || 'שגיאת רשת'), true);
    writeQueue = writeQueue.then(refresh);
    return null;
  });
}
function stillSaving(id){
  if (id < 0) { toast('רגע — עדיין נשמר…'); return true; }
  return false;
}
function findIn(list, id){ for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
function rowOf(st, pid, day){
  var rows = st.days[String(pid)] || (st.days[String(pid)] = []);
  for (var i = 0; i < rows.length; i++) if (rows[i].day === day) return rows[i];
  var r = {day: day, soil_status: null, watered: false, auto_expected: false, auto_confirmed: false};
  rows.push(r);
  rows.sort(function(a, b){ return a.day < b.day ? -1 : 1; });
  return r;
}
function daysBetween(a, b){ return Math.round((parseDay(b) - parseDay(a)) / 864e5); }
function localStatus(p){
  if (p.irrigation_mode === 'auto') return 'auto';
  return p.days_since_water > p.interval_days ? 'overdue' : p.days_since_water === p.interval_days ? 'due' : 'ok';
}
function addEventLocal(st, pid, type, at, source, note){
  (st.events[String(pid)] || (st.events[String(pid)] = []))
    .push({id: tempSeq--, event_type: type, event_at: at, source: source || 'manual', note: note || null});
}
function markWatered(st, pid, day){
  rowOf(st, pid, day).watered = true;
  var p = findIn(st.plants, pid);
  if (p && (!p.last_water || p.last_water < day)) {
    p.last_water = day;
    p.days_since_water = daysBetween(day, st.today);
    p.status = localStatus(p);
  }
}
function dropSuggestions(st, pid, kinds){
  st.suggestions = st.suggestions.filter(function(x){ return !(x.plant_id === pid && (!kinds || kinds.indexOf(x.kind) >= 0)); });
}
// Same counts the server computes, so the header moves with the click too.
function recountSummary(st){
  var auto = {};
  st.plants.forEach(function(p){ if (p.irrigation_mode === 'auto') auto[p.id] = true; });
  var pending = 0;
  Object.keys(st.days).forEach(function(pid){
    if (!auto[pid]) return;
    st.days[pid].forEach(function(r){ if (r.day <= st.today && r.auto_expected && !r.auto_confirmed && !r.watered) pending++; });
  });
  st.summary = {
    due_today: st.plants.filter(function(p){ return p.status === 'due'; }).length,
    overdue: st.plants.filter(function(p){ return p.status === 'overdue'; }).length,
    auto_pending_confirm: pending
  };
}

// ── Unsaved-changes guard for edit popups ──────────────────────
// Each guarded popup says whether it has unsaved edits, how to save them all, and how to drop them.
var GUARDS = {
  'plant-modal':   {dirty: function(){ return plantDirty(); }, save: function(){ return savePlant(); }, discard: function(){ editCtx = null; }},
  'configs-modal': {dirty: function(){ return cfgDirty(); },   save: function(){ return saveConfig(); }, discard: function(){ cfgCtx = null; }},
  'rooms-modal':   {dirty: function(){ return roomsDirty(); }, save: function(){ return saveAllRooms(); }, discard: function(){}},
  'dead-modal':    {dirty: function(){ return deadDirty(); },  save: function(){ return saveDead(); },   discard: function(){ deadCtx = null; }}
};
// Leave a popup (close it, or go back inside it); with unsaved edits, ask first.
function requestLeave(id, leave){
  leave = leave || function(){ closeModal(id); };
  var g = GUARDS[id];
  if (g && isOpen(id) && g.dirty()) { showUnsaved(id, leave); return; }
  leave();
}
function showUnsaved(id, leave){
  var box = document.getElementById(id).querySelector('.modal');
  var bar = box.querySelector('.pt-unsaved');
  if (!bar) {
    bar = document.createElement('div');
    bar.className = 'pt-unsaved';
    bar.setAttribute('role', 'alert');
    box.insertBefore(bar, box.children[1] || null);
  }
  bar.innerHTML = '<span>יש שינויים שלא נשמרו</span>' +
    '<button class="btn btn-primary btn-xs" data-a="save">שמור הכל</button>' +
    '<button class="btn btn-ghost btn-xs" data-a="discard">סגור בלי לשמור</button>' +
    '<button class="btn btn-ghost btn-xs" data-a="stay">המשך לערוך</button>';
  bar.onclick = function(ev){
    var a = ev.target.getAttribute('data-a');
    if (!a) return;
    bar.remove();
    if (a === 'save') { if (GUARDS[id].save() !== false) leave(); }
    else if (a === 'discard') { GUARDS[id].discard(); leave(); }
  };
  box.scrollTop = 0;
}
function setDirtyClass(btnId, on){ var b = document.getElementById(btnId); if (b) b.classList.toggle('dirty', !!on); }

function refresh(){
  return api('GET', '/api/plants').then(function(d){
    if (!d && !state) document.getElementById('pt-rows').innerHTML = '<div class="pt-empty">שגיאה בטעינת הנתונים</div>';
    return d;
  });
}
function init(){
  var cached = readCache();
  if (cached) { state = cached; render(); } else { refresh(); }
}
// A tab left open past midnight refreshes when it becomes visible again.
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState !== 'visible') return;
  var now = localDate(new Date());
  if (now !== TODAY) { TODAY = now; refresh(); }
});

// ── Lookups ────────────────────────────────────────────────────
function plantById(id){ for (var i = 0; i < state.plants.length; i++) if (state.plants[i].id === id) return state.plants[i]; return null; }
function dayRow(pid, day){ var rows = state.days[String(pid)] || []; for (var i = 0; i < rows.length; i++) if (rows[i].day === day) return rows[i]; return null; }
function dayEvents(pid, day){ return (state.events[String(pid)] || []).filter(function(e){ return e.event_at.slice(0, 10) === day; }); }

// ── Render ─────────────────────────────────────────────────────
function render(){
  renderSummary();
  renderSuggestions();
  renderRooms();
  renderRows();
  if (dayCtx && isOpen('day-modal')) renderDay();
  if (isOpen('rooms-modal')) renderRoomsManager();
  if (isOpen('configs-modal') && !cfgCtx) renderConfigList();
  if (isOpen('deleted-modal')) renderDeletedList();
  if (isOpen('archive-modal')) renderArchiveList();
}

function renderSummary(){
  var s = state.summary, due = s.due_today + s.overdue;
  document.getElementById('pt-summary').innerHTML =
    '<div class="pt-stat due"><b>' + s.due_today + '</b> להשקות היום</div>' +
    '<div class="pt-stat overdue"><b>' + s.overdue + '</b> באיחור</div>' +
    '<div class="pt-stat pending"><b>' + s.auto_pending_confirm + '</b> אוטומטי ממתין לאישור</div>' +
    '<span class="spacer"></span>' +
    '<button class="btn btn-primary btn-sm" onclick="waterAllDue()"' + (due ? '' : ' disabled') + '>💧 השקה לכל הממתינים (' + due + ')</button>';
}
function waterAllDue(){
  var n = state.summary.due_today + state.summary.overdue;
  if (!n || !confirm('לסמן השקה עכשיו ל-' + n + ' עציצים?')) return;
  var at = localDateTime(new Date());
  mutate('POST', '/api/plants/water-due', {event_at: at}, function(st){
    st.plants.forEach(function(p){
      if (p.status !== 'due' && p.status !== 'overdue') return;
      addEventLocal(st, p.id, 'water', at);
      markWatered(st, p.id, at.slice(0, 10));
      dropSuggestions(st, p.id, ['overdue']);
    });
  }, 'סומנה השקה ל-' + n + ' עציצים');
}

var suggOpen = true;
try { suggOpen = localStorage.getItem('plants_sugg_open') !== '0'; } catch (_) {}
function toggleSugg(){
  suggOpen = !suggOpen;
  try { localStorage.setItem('plants_sugg_open', suggOpen ? '1' : '0'); } catch (_) {}
  renderSuggestions();
  renderRows();
}
// The floating button: count of tips and whether they are shown inside the plant cards.
function renderSuggestions(){
  var n = state.suggestions.length, fab = document.getElementById('pt-fab');
  fab.style.display = n ? '' : 'none';
  fab.className = 'pt-fab' + (suggOpen ? '' : ' off');
  fab.setAttribute('aria-pressed', suggOpen ? 'true' : 'false');
  fab.title = suggOpen ? 'הסתר המלצות' : 'הצג המלצות';
  document.getElementById('pt-fab-count').textContent = n;
}
function plantTipsHtml(pid){
  if (!suggOpen) return '';
  var html = state.suggestions.map(function(s, i){
    if (s.plant_id !== pid) return '';
    var a = s.action, btns = '';
    if (a) {
      var label = a.type === 'set_interval' ? 'החל (' + a.value + ' ימים)' : ACTION_LABELS[a.type];
      btns += '<button class="btn btn-primary btn-xs" onclick="applySuggestion(' + i + ')">' + label + '</button>';
    }
    if (s.kind === 'seasonal') btns += '<button class="btn btn-ghost btn-xs" onclick="dismissSeason(' + s.plant_id + ')">התעלם</button>';
    // the card already shows the plant name, so drop the "name: " prefix
    var text = s.text.indexOf(':') > 0 ? s.text.slice(s.text.indexOf(':') + 1).trim() : s.text;
    return '<div class="pt-sugg ' + s.level + '"><span class="pt-sugg-text">💡 ' + esc(text) + '</span><span class="pt-sugg-btns">' + btns + '</span></div>';
  }).join('');
  return html ? '<div class="pt-tips">' + html + '</div>' : '';
}
function applySuggestion(i){
  var s = state.suggestions[i], a = s.action, pid = s.plant_id, now = localDateTime(new Date());
  if (stillSaving(pid)) return;
  if (a.type === 'set_interval') {
    var body = {interval_days: a.value};
    if (a.season_key) body.season_ack = a.season_key;
    mutate('PUT', '/api/plants/' + pid, body, function(st){
      var p = findIn(st.plants, pid);
      p.interval_days = a.value;
      p.status = localStatus(p);
      dropSuggestions(st, pid, ['dries_fast', 'overwater', 'seasonal']);
    }, 'המרווח עודכן');
  } else if (a.type === 'water_now') {
    mutate('POST', '/api/plants/' + pid + '/events', {event_type: 'water', event_at: now}, function(st){
      addEventLocal(st, pid, 'water', now);
      markWatered(st, pid, now.slice(0, 10));
      dropSuggestions(st, pid, ['overdue']);
    }, 'סומנה השקה');
  } else if (a.type === 'fertilize_now') {
    mutate('POST', '/api/plants/' + pid + '/events', {event_type: 'fertilize', event_at: now}, function(st){
      addEventLocal(st, pid, 'fertilize', now);
      dropSuggestions(st, pid, ['fertilize']);
    }, 'סומן דישון');
  } else if (a.type === 'confirm_auto') {
    mutate('POST', '/api/plants/' + pid + '/confirm-auto', {day: a.day}, function(st){ confirmLocal(st, pid, a.day); },
           'ההשקה אושרה');
  } else if (a.type === 'set_soil') {
    openDay(pid, TODAY);
  }
}
function dismissSeason(pid){
  if (stillSaving(pid)) return;
  mutate('POST', '/api/plants/' + pid + '/dismiss-season', {}, function(st){ dropSuggestions(st, pid, ['seasonal']); }, 'ההמלצה הוסתרה');
}

function renderRows(){
  var el = document.getElementById('pt-rows');
  if (!state.plants.length) {
    el.innerHTML = '<div class="pt-empty">עדיין אין עציצים — לחצו "+ עציץ חדש" כדי להתחיל 🌱</div>';
    return;
  }
  var days = state.window.slice().reverse();  // today first = RTL leading edge
  var groups = roomGroups().filter(function(g){ return roomFilter === 'all' || g.key === roomFilter; });
  el.innerHTML = groups.map(function(g){
    return '<div class="pt-room-head"><span>' + esc(g.name) + '</span><span class="pt-room-count">' + g.plants.length + '</span></div>' +
      g.plants.map(function(p){ return plantRowHtml(p, days); }).join('');
  }).join('');
}
function plantRowHtml(p, days){
  var cfg = p.config_id != null ? configById(p.config_id) : null;
  var room = p.room_id != null ? roomById(p.room_id) : null;
  var mode = cfg ? 'אוטומטי · ' + esc(cfg.name) + ' · ' + scheduleText(cfg)
           : p.irrigation_mode === 'auto' ? 'אוטומטי · כל ' + p.interval_days + ' ימים · ' + esc(p.auto_time || '')
           : 'ידני · כל ' + p.interval_days + ' ימים';
  var last = !p.last_water ? 'טרם הושקה' : p.days_since_water === 0 ? 'הושקה היום'
           : p.days_since_water === 1 ? 'הושקה אתמול' : 'הושקה לפני ' + p.days_since_water + ' ימים';
  var pill = p.status === 'overdue' ? '<span class="pt-pill overdue">באיחור · ' + last + '</span>'
           : p.status === 'due' ? '<span class="pt-pill due">להשקות היום</span>'
           : p.status === 'auto' ? '<span class="pt-pill auto">' + last + '</span>'
           : '<span class="pt-pill ok">' + last + '</span>';
  return '<div class="pt-pcard' + (p.id < 0 ? ' pending' : '') + '">' +
    '<button class="pt-plant" onclick="openPlantModal(' + p.id + ')" title="עריכת עציץ">' + plantIcon(p.plant_type, p.color, p.name, 44) +
      '<div><div class="pt-plant-name">' + esc(p.name) + '</div>' +
      '<div class="pt-plant-meta">' + mode + (room ? ' · ' + esc(room.name) : '') + '</div></div>' + pill + '</button>' +
    '<div class="pt-cells">' + days.map(function(day){ return cellHtml(p, day); }).join('') + '</div>' +
    plantTipsHtml(p.id) + '</div>';
}

// ── Rooms: filter chips + grouping ─────────────────────────────
var ROOM_FILTER_KEY = 'plants_room_filter';
var roomFilter = 'all';  // 'all' | 'none' | '<room id>'
try { roomFilter = localStorage.getItem(ROOM_FILTER_KEY) || 'all'; } catch (_) {}
function setRoomFilter(v){
  roomFilter = v;
  try { localStorage.setItem(ROOM_FILTER_KEY, v); } catch (_) {}
  renderRooms();
  renderRows();
}
function roomById(id){ var rs = state.rooms || []; for (var i = 0; i < rs.length; i++) if (rs[i].id === id) return rs[i]; return null; }
// Groups in room order with unassigned plants last; rooms without plants are skipped.
function roomGroups(){
  var groups = (state.rooms || []).map(function(r){ return {key: String(r.id), name: r.name, plants: []}; });
  var none = {key: 'none', name: 'ללא חדר', plants: []};
  var byKey = {};
  groups.forEach(function(g){ byKey[g.key] = g; });
  state.plants.forEach(function(p){ ((p.room_id != null && byKey[String(p.room_id)]) || none).plants.push(p); });
  return groups.concat([none]).filter(function(g){ return g.plants.length; });
}
function renderRooms(){
  var groups = roomGroups();
  if (roomFilter !== 'all' && !groups.some(function(g){ return g.key === roomFilter; })) roomFilter = 'all';
  var chips = [{key: 'all', name: 'הכל', n: state.plants.length}].concat(groups.map(function(g){
    return {key: g.key, name: g.name, n: g.plants.length};
  }));
  document.getElementById('pt-room-chips').innerHTML = state.plants.length ? chips.map(function(c){
    return '<button class="pt-chip' + (c.key === roomFilter ? ' on' : '') + '" onclick="setRoomFilter(\'' + c.key + '\')">' +
      esc(c.name) + ' <b>' + c.n + '</b></button>';
  }).join('') : '';
}
function cellHtml(p, day){
  var d = parseDay(day), label = WEEKDAYS[d.getDay()] + '<b>' + d.getDate() + '</b>';
  var r = dayRow(p.id, day);
  if (!r) return '<div class="pt-cell blank"><span class="pt-cell-date">' + label + '</span></div>';
  var drop = r.watered ? 'watered' : (r.auto_expected && !r.auto_confirmed ? 'expected' : 'none');
  var marks = dayEvents(p.id, day).filter(function(e){ return e.event_type !== 'water'; })
    .map(function(e){ return '<span class="pt-mark" style="background:' + EVENT_COLORS[e.event_type] + '"></span>'; }).join('');
  var tip = fmtDay(day) + (r.soil_status ? ' · אדמה ' + SOIL_LABELS[r.soil_status] : '') +
            (r.watered ? ' · הושקה' : drop === 'expected' ? ' · השקה אוטומטית ממתינה לאישור' : '');
  return '<button class="pt-cell' + (day === state.today ? ' today' : '') + '" title="' + esc(tip) + '" onclick="openDay(' + p.id + ',\'' + day + '\')">' +
    '<span class="pt-cell-date">' + label + '</span>' +
    '<svg class="pt-drop ' + drop + '" viewBox="0 0 16 18">' + DROP + '</svg>' +
    '<span class="pt-marks">' + marks + '</span>' +
    '<span class="pt-soil ' + (r.soil_status || '') + '"></span></button>';
}

// ── Day editor ─────────────────────────────────────────────────
var dayCtx = null;
function openDay(pid, day){ dayCtx = {pid: pid, day: day}; renderDay(); openModal('day-modal'); }
function renderDay(){
  var p = plantById(dayCtx.pid);
  if (!p) { closeModal('day-modal'); dayCtx = null; return; }
  var day = dayCtx.day, r = dayRow(p.id, day) || {}, evs = dayEvents(p.id, day);
  var now = localDateTime(new Date());
  var defAt = day === TODAY ? now : day + 'T12:00';
  var soil = ['dry', 'humid', 'wet'].map(function(k){
    return '<button class="' + (r.soil_status === k ? 'on' : '') + '" onclick="setSoil(\'' + k + '\')">' + SOIL_LABELS[k] + '</button>';
  }).join('') + '<button class="' + (!r.soil_status ? 'on' : '') + '" onclick="setSoil(null)">לא ידוע</button>';
  var confirmBtn = (p.irrigation_mode === 'auto' && r.auto_expected && !r.auto_confirmed && !r.watered)
    ? '<div class="field-row"><button class="btn btn-primary" style="width:100%;justify-content:center" onclick="confirmAuto()">✔ אשר השקה אוטומטית (' + esc(p.auto_time) + ')</button></div>'
    : '';
  var types = Object.keys(EVENT_LABELS).filter(function(k){ return k !== 'water'; })
    .map(function(k){ return '<option value="' + k + '">' + EVENT_LABELS[k] + '</option>'; }).join('');
  var list = evs.length ? evs.map(function(e){
    return '<div class="pt-ev"><span>' + EVENT_LABELS[e.event_type] + ' · ' + e.event_at.slice(11, 16) +
      (e.source === 'auto_confirmed' ? ' (אוטומטי)' : '') + (e.note ? ' — ' + esc(e.note) : '') + '</span>' +

  document.getElementById('day-body').innerHTML =

      '<button class="btn btn-primary" onclick="addWater()">💧 סמן השקה</button></div></div>' +
    '<div class="field-row"><span class="field-label">אירוע נוסף באותו מועד</span><div class="pt-inline">' +

      '<button class="btn btn-ghost" onclick="addOtherEvent()">הוסף</button></div></div>' +
    '<div class="field-row"><span class="field-label">אירועים ביום זה</span><div class="pt-evlist">' + list + '</div></div>';

function eventAt(){ return document.getElementById('day-at').value; }
function setSoil(k){
  var pid = dayCtx.pid, day = dayCtx.day;
  mutate('PUT', '/api/plants/' + pid + '/soil', {day: day, soil_status: k}, function(st){
    rowOf(st, pid, day).soil_status = k;
    if (k) dropSuggestions(st, pid, ['no_soil']);
  }, 'מצב האדמה עודכן');
}
function addWater(){
  var pid = dayCtx.pid, at = eventAt();
  mutate('POST', '/api/plants/' + pid + '/events', {event_type: 'water', event_at: at}, function(st){
    addEventLocal(st, pid, 'water', at);
    markWatered(st, pid, at.slice(0, 10));
    dropSuggestions(st, pid, ['overdue']);
  }, 'סומנה השקה');
}
function addOtherEvent(){
  var pid = dayCtx.pid, at = eventAt(), type = document.getElementById('day-ev-type').value,
      note = document.getElementById('day-ev-note').value;
  mutate('POST', '/api/plants/' + pid + '/events', {event_type: type, event_at: at, note: note}, function(st){
    addEventLocal(st, pid, type, at, 'manual', note.trim());
    if (type === 'fertilize') dropSuggestions(st, pid, ['fertilize']);
  }, 'האירוע נוסף');
}
function confirmLocal(st, pid, day){
  var p = findIn(st.plants, pid), r = rowOf(st, pid, day);
  r.auto_confirmed = true;
  addEventLocal(st, pid, 'water', day + 'T' + ((configById(p && p.config_id) || {}).time || (p && p.auto_time) || '07:00'), 'auto_confirmed');
  markWatered(st, pid, day);
  dropSuggestions(st, pid, ['auto_unconfirmed']);
}
function confirmAuto(){
  var pid = dayCtx.pid, day = dayCtx.day;
  mutate('POST', '/api/plants/' + pid + '/confirm-auto', {day: day}, function(st){ confirmLocal(st, pid, day); }, 'ההשקה אושרה');
}
function deleteEvent(id){
  if (stillSaving(id) || !confirm('למחוק את האירוע?')) return;
  mutate('DELETE', '/api/plants/events/' + id, {}, function(st){
    Object.keys(st.events).forEach(function(pid){
      var e = findIn(st.events[pid], id);
      if (!e) return;
      st.events[pid] = st.events[pid].filter(function(x){ return x.id !== id; });
      var day = e.event_at.slice(0, 10);
      var stillWatered = st.events[pid].some(function(x){ return x.event_type === 'water' && x.event_at.slice(0, 10) === day; });
      var r = rowOf(st, Number(pid), day);
      if (e.event_type === 'water' && !stillWatered) r.watered = false;
      if (e.source === 'auto_confirmed') r.auto_confirmed = false;
    });
  }, 'האירוע נמחק');
}

// Returns false when the form is invalid (the popup then stays open).
function savePlant(){
  var e = editCtx;
  if (!e) return true;
  var interval = parseInt(e.interval_days, 10);
  var body = {name: String(e.name).trim(), plant_type: e.plant_type, color: e.color,
              irrigation_mode: e.irrigation_mode, interval_days: interval, room_id: e.room_id};
  if (!body.name) { toast('יש להזין שם', true); return false; }
  if (e.irrigation_mode === 'auto') {
    if (e.config_id == null) { toast('בחרו תוכנית השקיה', true); return false; }
    body.config_id = e.config_id;
  } else if (!(interval >= 1 && interval <= 60)) { toast('מרווח השקיה חייב להיות 1-60 ימים', true); return false; }
  var auto = e.irrigation_mode === 'auto';
  if (e.id) {
    mutate('PUT', '/api/plants/' + e.id, body, function(st){
      var p = findIn(st.plants, e.id);
      Object.assign(p, {name: body.name, plant_type: body.plant_type, color: body.color, irrigation_mode: body.irrigation_mode,
                        interval_days: auto ? p.interval_days : interval, room_id: body.room_id,
                        config_id: auto ? body.config_id : null});
      p.status = localStatus(p);
    }, 'העציץ עודכן');
  } else {
    mutate('POST', '/api/plants', body, function(st){
      var id = tempSeq--;
      st.plants.push({id: id, name: body.name, plant_type: body.plant_type, color: body.color, irrigation_mode: body.irrigation_mode,
                      interval_days: auto ? 3 : interval, auto_time: null, season_ack: null, created_at: st.today,
                      last_water: null, days_since_water: 0, status: auto ? 'auto' : 'ok',
                      room_id: body.room_id, config_id: auto ? body.config_id : null});
      rowOf(st, id, st.today);
    }, 'העציץ נוסף');
  }
  editCtx = null;
  closeModal('plant-modal');
  return true;
}
function deletePlant(){
  var e = editCtx;
  if (!confirm('למחוק את "' + e.name + '"? אפשר לשחזר מתוך "נמחקו".')) return;
  var gone = plantById(e.id);
  mutate('DELETE', '/api/plants/' + e.id, {}, function(st){
    st.plants = st.plants.filter(function(p){ return p.id !== e.id; });
    dropSuggestions(st, e.id);
    if (gone) deletedPlants.unshift(gone);
  }, 'העציץ נמחק');
  editCtx = null;
  closeModal('plant-modal');
}

// ── Dead plants → archive ──────────────────────────────────────
var CAUSE_LABELS = {overwater: 'השקיית יתר', underwater: 'חוסר מים', pests: 'מזיקים', temperature: 'חום / קור', unknown: 'לא ידוע'};
var deadCtx = null, archivePlants = [];
function deadDirty(){ return !!deadCtx && (deadCtx.died_at !== TODAY || deadCtx.cause !== 'unknown' || deadCtx.note.trim() !== ''); }
function deadMarkDirty(){ setDirtyClass('dead-save', deadDirty()); }
function openDead(pid){

function deadSet(k, v){ deadCtx[k] = v; renderDead(); }
function renderDead(){

    '<div class="field-row"><label class="field-label" for="dead-date">תאריך</label>' +
      '<input class="field-input" type="date" id="dead-date" value="' + c.died_at + '" min="' + p.created_at + '" max="' + TODAY + '" ' +
      'oninput="deadCtx.died_at=this.value;deadMarkDirty()"></div>' +
    '<div class="field-row"><span class="field-label">סיבה</span><div class="pt-seg">' + causes + '</div></div>' +
    '<div class="field-row"><label class="field-label" for="dead-note">הערה (לא חובה)</label>' +
      '<input class="field-input" id="dead-note" maxlength="200" placeholder="מה למדנו?" value="' + esc(c.note) + '" ' +
      'oninput="deadCtx.note=this.value;deadMarkDirty()"></div>' +
    '<div class="pt-plant-meta" style="white-space:normal">העציץ יוסר מהדף, ההיסטוריה שלו נשמרת ואפשר להחיות אותו מהארכיון.</div>' +
    '<div class="modal-footer"><button class="btn btn-ghost" onclick="requestLeave(\'dead-modal\')">ביטול</button>' +
      '<button id="dead-save" class="btn btn-danger' + (deadDirty() ? ' dirty' : '') + '" onclick="saveDead()">העבר לארכיון</button></div>';
}
// Returns false when the form is invalid (the popup then stays open).
function saveDead(){
  var c = deadCtx;
  if (!c) return true;
  if (!c.died_at || c.died_at > TODAY) { toast('תאריך לא תקין', true); return false; }
  var p = plantById(c.id), note = c.note.trim();
  mutate('POST', '/api/plants/' + c.id + '/dead', {died_at: c.died_at, cause: c.cause, note: note}, function(st){
    st.plants = st.plants.filter(function(x){ return x.id !== c.id; });
    dropSuggestions(st, c.id);
    if (p) archivePlants.unshift(Object.assign({}, p, {died_at: c.died_at, cause: c.cause, note: note || null,
      lifespan_days: daysBetween(p.created_at, c.died_at), waterings: null}));
  }, (p ? p.name : 'העציץ') + ' הועבר לארכיון');
  deadCtx = null;
  closeModal('dead-modal');
  return true;
}
function fmtDate(iso){ var d = parseDay(iso); return d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear(); }
function fmtLifespan(n){ return n < 60 ? n + ' ימים' : n < 730 ? Math.round(n / 30.4) + ' חודשים' : (n / 365).toFixed(1) + ' שנים'; }
function renderArchiveList(){
  document.getElementById('archive-body').innerHTML = archivePlants.length ? archivePlants.map(function(p){
    return '<div class="pt-arch-row">' + plantIcon(p.plant_type, p.color, p.name, 36) +
      '<div><div class="pt-cfg-name">' + esc(p.name) + '</div>' +
      '<div class="pt-plant-meta">🥀 ' + fmtDate(p.died_at) + ' · חי ' + fmtLifespan(p.lifespan_days) +
        ' · ' + CAUSE_LABELS[p.cause || 'unknown'] + (p.waterings != null ? ' · ' + p.waterings + ' השקיות' : '') + '</div>' +
      (p.note ? '<div class="pt-arch-note">' + esc(p.note) + '</div>' : '') + '</div>' +
      '<button class="btn btn-ghost btn-sm" onclick="revivePlant(' + p.id + ')">החייאה</button></div>';
  }).join('') : '<div class="pt-plant-meta">הארכיון ריק 🌱</div>';
}
function openArchive(){
  renderArchiveList();
  openModal('archive-modal');
  fetch('/api/plants/archive').then(function(r){ return r.json(); }).then(function(d){
    if (!d.ok) throw new Error(d.error);
    archivePlants = d.plants;
    renderArchiveList();
  }).catch(function(e){ toast(e.message || 'שגיאה', true); });
}
function revivePlant(id){
  var p = findIn(archivePlants, id);
  mutate('POST', '/api/plants/' + id + '/revive', {}, function(st){
    archivePlants = archivePlants.filter(function(x){ return x.id !== id; });

// ── Irrigation configs ─────────────────────────────────────────
var DAY_LETTERS = ['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'];  // Sun=0 … Sat=6

    ? c.weekdays.map(function(d){ return DAY_LETTERS[d] + "׳"; }).join(' ')
    : 'כל ' + c.interval_days + ' ימים';

var cfgCtx = null, cfgOrig = null;
function cfgSnapshot(c){
  return c ? JSON.stringify([String(c.name).trim(), c.style, c.style === 'interval' ? String(c.interval_days) : '',
                             c.style === 'weekdays' ? c.weekdays.slice().sort() : [], c.time, c.plant_ids.slice().sort()]) : '';
}
function cfgDirty(){ return !!cfgCtx && cfgSnapshot(cfgCtx) !== cfgOrig; }
function cfgMarkDirty(){ setDirtyClass('cfg-save', cfgDirty()); }

    (list.length ? list.map(function(c){

        '<button class="btn btn-ghost btn-sm" onclick="editConfig(' + c.id + ')">עריכה</button>' +
        '<button class="btn btn-ghost btn-sm" onclick="deleteConfig(' + c.id + ')" title="מחיקה" aria-label="מחיקה">✕</button></div>';
    }).join('') : '<div class="pt-plant-meta">עוד אין תוכניות. תוכנית אחת יכולה לשמש עציצים רבים.</div>') +
    '<div class="modal-footer"><button class="btn btn-primary" onclick="editConfig(null)">+ תוכנית חדשה</button></div>';
}
function openConfigs(){

  openModal('configs-modal');
}
function editConfig(id){

  var c = id != null ? configById(id) : null;
  cfgCtx = c
    ? {id: c.id, name: c.name, style: c.style, interval_days: c.interval_days || 2, weekdays: c.weekdays.slice(), time: c.time,

function cfgSet(k, v){ cfgCtx[k] = v; renderConfigEditor(); }

function cfgTogglePlant(pid, on){
  cfgCtx.plant_ids = cfgCtx.plant_ids.filter(function(x){ return x !== pid; });
  if (on) cfgCtx.plant_ids.push(pid);
  cfgMarkDirty();
}
function renderConfigEditor(){
  var c = cfgCtx;
  var styles = '<button class="' + (c.style === 'interval' ? 'on' : '') + '" onclick="cfgSet(\'style\',\'interval\')">כל כמה ימים</button>' +
               '<button class="' + (c.style === 'weekdays' ? 'on' : '') + '" onclick="cfgSet(\'style\',\'weekdays\')">ימים בשבוע</button>';
  var when = c.style === 'interval'
    ? '<input class="field-input" type="number" min="1" max="60" id="cfg-interval" value="' + c.interval_days + '" oninput="cfgCtx.interval_days=this.value;cfgMarkDirty()">'
    : '<div class="pt-days">' + DAY_LETTERS.map(function(l, d){
        return '<button class="' + (c.weekdays.indexOf(d) >= 0 ? 'on' : '') + '" onclick="cfgToggleDay(' + d + ')">' + l + '</button>';
      }).join('') + '</div>';
  var plants = state.plants.filter(function(p){ return p.id > 0; }).map(function(p){
    var other = p.config_id != null && p.config_id !== c.id ? configById(p.config_id) : null;
    return '<label><input type="checkbox"' + (c.plant_ids.indexOf(p.id) >= 0 ? ' checked' : '') +
      ' onchange="cfgTogglePlant(' + p.id + ', this.checked)">' + plantIcon(p.plant_type, p.color, p.name, 24) + esc(p.name) +
      (other ? '<small>כעת: ' + esc(other.name) + '</small>' : '') + '</label>';
  }).join('');
  document.getElementById('configs-body').innerHTML =
    '<div class="modal-title">' + (c.id ? 'עריכת תוכנית' : 'תוכנית השקיה חדשה') + '</div>' +
    '<div class="field-row"><label class="field-label" for="cfg-name">שם</label>' +
      '<input class="field-input" id="cfg-name" maxlength="30" placeholder="טפטפת מרפסת" value="' + esc(c.name) + '" oninput="cfgCtx.name=this.value;cfgMarkDirty()"></div>' +
    '<div class="field-row"><span class="field-label">מתי</span><div class="pt-seg">' + styles + '</div></div>' +
    '<div class="field-row">' + when + '</div>' +
    '<div class="field-row"><label class="field-label" for="cfg-time">שעה</label>' +
      '<input class="field-input" type="time" id="cfg-time" value="' + esc(c.time) + '" oninput="cfgCtx.time=this.value;cfgMarkDirty()"></div>' +
    '<div class="field-row"><span class="field-label">עציצים בתוכנית (יעברו להשקיה אוטומטית)</span>' +
      '<div class="pt-pick">' + (plants || '<div class="pt-plant-meta">אין עציצים</div>') + '</div></div>' +
    '<div class="modal-footer"><button class="btn btn-ghost" onclick="requestLeave(\'configs-modal\', openConfigs)">חזרה</button>' +
      '<button id="cfg-save" class="btn btn-primary' + (cfgDirty() ? ' dirty' : '') + '" onclick="saveConfig()">שמירה</button></div>';
}
// Returns false when the form is invalid (the popup then stays open).
function saveConfig(){
  var c = cfgCtx;
  if (!c) return true;
  var body = {name: String(c.name).trim(), style: c.style, time: c.time, plant_ids: c.plant_ids.slice()};
  if (!body.name) { toast('יש להזין שם לתוכנית', true); return false; }
  if ((state.configs || []).some(function(x){ return x.name === body.name && x.id !== c.id; })) { toast('קיימת כבר תוכנית בשם זה', true); return false; }
  if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(body.time || '')) { toast('שעת השקיה לא תקינה', true); return false; }
  if (c.style === 'interval') {
    body.interval_days = parseInt(c.interval_days, 10);
    if (!(body.interval_days >= 1 && body.interval_days <= 60)) { toast('מרווח השקיה חייב להיות 1-60 ימים', true); return false; }
  } else {
    body.weekdays = c.weekdays.slice().sort();
    if (!body.weekdays.length) { toast('יש לבחור לפחות יום אחד', true); return false; }
  }
  function assignLocal(st, cid){
    st.plants.forEach(function(p){
      var on = body.plant_ids.indexOf(p.id) >= 0;
      if (on) { p.irrigation_mode = 'auto'; p.config_id = cid; }
      else if (p.config_id === cid) { p.irrigation_mode = 'manual'; p.config_id = null; }
      p.status = localStatus(p);
    });
  }
  var fields = {name: body.name, style: body.style, time: body.time,
                interval_days: body.style === 'interval' ? body.interval_days : null,
                weekdays: body.style === 'weekdays' ? body.weekdays : []};
  if (c.id) {
    mutate('PUT', '/api/plants/configs/' + c.id, body, function(st){
      Object.assign(findIn(st.configs, c.id), fields);
      assignLocal(st, c.id);
    }, 'התוכנית עודכנה');
  } else {
    mutate('POST', '/api/plants/configs', body, function(st){
      var id = tempSeq--;
      st.configs.push(Object.assign({id: id, plant_count: body.plant_ids.length}, fields));
      assignLocal(st, id);
    }, 'התוכנית נוצרה');
  }
  openConfigs();
  return true;
}
function deleteConfig(id){
  if (stillSaving(id)) return;
  var c = configById(id), used = countOn(id);
  if (used) { toast('התוכנית בשימוש ב-' + used + ' עציצים — העבירו אותם לתוכנית אחרת או להשקיה ידנית', true); return; }
  if (!confirm('למחוק את התוכנית "' + (c ? c.name : '') + '"?')) return;
  mutate('DELETE', '/api/plants/configs/' + id, {}, function(st){
    st.configs = st.configs.filter(function(x){ return x.id !== id; });
  }, 'התוכנית נמחקה');
}

// ── Room manager ───────────────────────────────────────────────
// Rendered from state, so it follows every change instantly; typed-but-unsaved names survive re-renders.
var deletedRooms = [];
function roomInputValue(id){ var el = document.getElementById('room-name-' + id); return el ? el.value : null; }
function newRoomName(){ var el = document.getElementById('room-new'); return el ? el.value.trim() : ''; }
function dirtyRoomIds(){
  return (state.rooms || []).filter(function(r){
    var v = roomInputValue(r.id);
    return v !== null && v.trim() !== r.name;
  }).map(function(r){ return r.id; });
}
function roomsDirty(){ return isOpen('rooms-modal') && (dirtyRoomIds().length > 0 || newRoomName() !== ''); }
function roomInput(id){ var r = roomById(id); setDirtyClass('room-save-' + id, !!r && roomInputValue(id).trim() !== r.name); }
function newRoomInput(){ setDirtyClass('room-add', newRoomName() !== ''); }
function renderRoomsManager(){
  var typed = {}, typedNew = (document.getElementById('room-new') || {}).value || '';
  (state.rooms || []).forEach(function(r){ var v = roomInputValue(r.id); if (v !== null) typed[r.id] = v; });
  var counts = {};
  state.plants.forEach(function(p){ if (p.room_id != null) counts[p.room_id] = (counts[p.room_id] || 0) + 1; });
  document.getElementById('rooms-body').innerHTML =
    (state.rooms || []).map(function(r){
      var v = typed.hasOwnProperty(r.id) ? typed[r.id] : r.name, dirty = v.trim() !== r.name, temp = r.id < 0;
      return '<div class="pt-room-row"><input class="field-input" id="room-name-' + r.id + '" maxlength="30" value="' + esc(v) + '"' +
          (temp ? ' disabled' : ' oninput="roomInput(' + r.id + ')"') + '>' +
        '<span class="pt-room-count" title="עציצים בחדר">' + (counts[r.id] || 0) + '</span>' +
        '<button id="room-save-' + r.id + '" class="btn btn-ghost btn-sm' + (dirty ? ' dirty' : '') + '" onclick="renameRoom(' + r.id + ')"' + (temp ? ' disabled' : '') + '>שמירה</button>' +
        '<button class="btn btn-ghost btn-sm" onclick="deleteRoom(' + r.id + ')" title="מחיקה" aria-label="מחיקה"' + (temp ? ' disabled' : '') + '>✕</button></div>';
    }).join('') +
    '<div class="pt-room-row"><input class="field-input" id="room-new" maxlength="30" placeholder="חדר חדש" value="' + esc(typedNew) + '" oninput="newRoomInput()">' +
      '<button id="room-add" class="btn btn-primary btn-sm' + (typedNew.trim() ? ' dirty' : '') + '" onclick="addRoom()">+ הוסף</button></div>' +
    (deletedRooms.length
      ? '<div class="field-label" style="margin-top:16px">חדרים שנמחקו</div>' + deletedRooms.map(function(r){
          return '<div class="pt-restore-row"><span>' + esc(r.name) + '</span>' +
            '<button class="btn btn-ghost btn-sm" onclick="restoreRoom(' + r.id + ')">שחזור</button></div>';
        }).join('')
      : '');
}
function openRooms(){
  var body = document.getElementById('rooms-body');
  body.innerHTML = '';   // fresh form: no leftover typing from a discarded session
  renderRoomsManager();
  openModal('rooms-modal');
  fetch('/api/plants/rooms').then(function(r){ return r.json(); }).then(function(d){
    if (!d.ok) throw new Error(d.error);
    deletedRooms = d.deleted;
    if (isOpen('rooms-modal')) renderRoomsManager();
  }).catch(function(e){ toast(e.message || 'שגיאה', true); });
}
function roomNameError(name, exceptId){
  if (!name || name.length > 30) return 'שם חדר חייב להכיל 1-30 תווים';
  if ((state.rooms || []).some(function(r){ return r.name === name && r.id !== exceptId; })) return 'קיים כבר חדר בשם זה';
  return '';
}
function addRoom(){
  var name = newRoomName(), err = roomNameError(name, null);
  if (err) { toast(err, true); return false; }
  document.getElementById('room-new').value = '';
  mutate('POST', '/api/plants/rooms', {name: name}, function(st){ st.rooms.push({id: tempSeq--, name: name}); }, 'החדר נוסף');
  return true;
}
function renameRoom(id){
  if (stillSaving(id)) return true;
  var r = roomById(id), name = (roomInputValue(id) || '').trim();
  if (!r || name === r.name) return true;
  var err = roomNameError(name, id);
  if (err) { toast(err, true); return false; }
  mutate('PUT', '/api/plants/rooms/' + id, {name: name}, function(st){ findIn(st.rooms, id).name = name; }, 'שם החדר עודכן');
  return true;
}
function saveAllRooms(){
  var ok = true;
  dirtyRoomIds().forEach(function(id){ if (renameRoom(id) === false) ok = false; });
  if (newRoomName() && addRoom() === false) ok = false;
  return ok;
}
function deleteRoom(id){
  if (stillSaving(id)) return;
  var r = roomById(id);
  if (!confirm('למחוק את החדר "' + (r ? r.name : '') + '"? העציצים שבו יופיעו תחת "ללא חדר" עד שתשחזרו אותו.')) return;
  mutate('DELETE', '/api/plants/rooms/' + id, {}, function(st){
    st.rooms = st.rooms.filter(function(x){ return x.id !== id; });
    st.plants.forEach(function(p){ if (p.room_id === id) p.room_id = null; });
    if (r) deletedRooms.unshift({id: r.id, name: r.name});
  }, 'החדר נמחק');
}
function restoreRoom(id){
  var r = findIn(deletedRooms, id);
  if (r && (state.rooms || []).some(function(x){ return x.name === r.name; })) { toast('קיים כבר חדר בשם זה', true); return; }
  mutate('POST', '/api/plants/rooms/' + id + '/restore', {}, function(st){
    deletedRooms = deletedRooms.filter(function(x){ return x.id !== id; });
    if (r) st.rooms.push({id: r.id, name: r.name});
  }, 'החדר שוחזר');
}

init();
</script>

<button class="debug-fab" id="debug-fab" onclick="toggleDebugPanel()" title="App logs">&lt;/&gt;</button>
<div class="debug-panel" id="debug-panel">
  <div class="debug-hdr"><span>&#9658; app logs</span><div class="debug-hdr-btns"><button onclick="copyDebugPanel()">copy</button><button onclick="clearDebugPanel()">clear</button><button onclick="toggleDebugPanel()">&#x2715;</button></div></div>
  <div class="debug-feed" id="debug-feed"></div>
</div>
<script>
var _dbgEs=null;
function toggleDebugPanel(){var p=document.getElementById('debug-panel');var open=p.classList.toggle('open');if(open&&!_dbgEs)_startDebugStream()}
function _startDebugStream(){if(_dbgEs)return;_dbgEs=new EventSource('/api/debug-logs');_dbgEs.onmessage=function(e){if(!e.data||!e.data.trim())return;var f=document.getElementById('debug-feed');if(!f)return;var d=document.createElement('div');d.className='debug-line'+(e.data.toLowerCase().indexOf('error')>=0?' err':e.data.toLowerCase().indexOf('warn')>=0?' warn':'');d.textContent=e.data;f.appendChild(d);f.scrollTop=f.scrollHeight};_dbgEs.onerror=function(){if(_dbgEs){_dbgEs.close();_dbgEs=null}setTimeout(_startDebugStream,4000)}}
// Delayed: /api/debug-logs never returns (true SSE stream); starting it at
// the same instant as the page's real data fetches can starve them of a
// serverless execution slot. Server buffers logs regardless of client
// connection, so delaying costs no history.
document.addEventListener('DOMContentLoaded',function(){setTimeout(_startDebugStream,3000)});
function clearDebugPanel(){document.getElementById('debug-feed').innerHTML=''}
function copyDebugPanel(){var f=document.getElementById('debug-feed');navigator.clipboard.writeText(Array.from(f.children).map(function(e){return e.textContent}).join('\n')).catch(function(){})}
</script>
</body>
