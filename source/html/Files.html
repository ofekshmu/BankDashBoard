<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>קבצי נתונים</title>
<style>
/* ── Reset & tokens ────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --teal:       #1e9d8b;
  --teal-light: #e8f7f5;
  --teal-glow:  rgba(30,157,139,0.25);
  --navy:       #1e2a4a;
  --bg:         #f4f6f9;
  --white:      #ffffff;
  --border:     #eef0f6;
  --text-muted: #888;
  --text-sub:   #555;
  --red:        #e74c3c;
  --amber:      #f0b429;
  --green:      #2ecc71;
  --purple:     #9b59b6;
  --shadow-sm:  0 2px 10px rgba(0,0,0,.06);
  --shadow-md:  0 6px 24px rgba(0,0,0,.10);
  --radius:     14px;
  --radius-sm:  8px;
}
@keyframes _pageIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
@keyframes fadeIn  { from{opacity:0} to{opacity:1} }
@keyframes spin    { to{transform:rotate(360deg)} }
@keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
@keyframes rowIn   { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: var(--bg);
  display: flex;
  min-height: 100vh;
  direction: rtl;
  color: var(--navy);
  font-size: 14px;
  animation: _pageIn 0.22s ease;
}

/* ── Hamburger button ─────────────────────────────────────── */
.ham-btn {
  position: fixed;
  top: 18px; right: 18px;
  width: 42px; height: 42px;
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 400;
  box-shadow: var(--shadow-sm);
  color: var(--navy);
  transition: background .15s, color .15s, border-color .15s;
}
.ham-btn:hover {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}
.ham-btn.open { opacity: 0; pointer-events: none; }
.sidebar-close-btn {
  margin-right: auto;
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.1em;
  color: #555;
  line-height: 1;
  padding: 4px 6px;
  border-radius: 6px;
  transition: background .12s, color .12s;
}
.sidebar-close-btn:hover { background: #e8f7f5; color: var(--teal); }
.nav-overlay {
  position: fixed; inset: 0;
  background: rgba(15,22,45,.26);
  z-index: 1000;
  opacity: 0; pointer-events: none;
  transition: opacity .22s ease;
}
.nav-overlay.open { opacity: 1; pointer-events: all; }
.sidebar {
  position: fixed;
  top: 0; right: 0;
  height: 100vh; width: 230px;
  background: var(--white);
  z-index: 1002;
  transform: translate3d(100%, 0, 0);
  transition: transform .22s cubic-bezier(.4,0,.2,1);
  will-change: transform;
  box-shadow: -4px 0 24px rgba(0,0,0,.09);
  display: flex; flex-direction: column;
}
.sidebar.open { transform: translate3d(0, 0, 0); }
.sidebar-header {
  display: flex; align-items: center;
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sidebar-app-name { display:flex;align-items:center;gap:10px;text-decoration:none;font-size: .95em; font-weight: 700; color: var(--navy); }
.sidebar-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 0 16px; }
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0}
.nav-restart-btn{width:100%;padding:8px 12px;border:1.5px dashed var(--border);border-radius:8px;background:none;color:var(--text-muted);font-size:.78em;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:7px;justify-content:center;transition:background .15s,color .15s,border-color .15s}
.nav-restart-btn:hover{background:#fff3f3;color:#e53935;border-color:#e53935}
.nav-restart-btn:disabled{opacity:.5;cursor:default}
.nav-item {
  display: flex; align-items: center;
  padding: 10px 20px;
  text-decoration: none; color: var(--text-sub);
  font-size: .875em; font-weight: 500;
  transition: background .1s, color .1s;
  cursor: pointer; border: none; background: none;
  width: 100%; text-align: right;
  position: relative; letter-spacing: .1px;
}
.nav-item::before {
  content: '';
  position: absolute;
  right: 0; top: 22%; height: 56%;
  width: 3px; border-radius: 3px 0 0 3px;
  background: transparent; transition: background .1s;
}
.nav-item:hover { background: var(--teal-light); color: var(--teal); }
.nav-item:hover::before { background: var(--teal); }
.nav-item.active { color: #b8c0d0; cursor: default; pointer-events: none; }
.nav-sep { height: 1px; background: var(--border); margin: 8px 16px; }

/* ── Main ─────────────────────────────────────────────────────── */
.main {
  flex: 1;
  padding: 72px 32px 80px;
  min-width: 0;
}

/* ── Page header ──────────────────────────────────────────────── */
.page-header {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 28px;
  flex-wrap: wrap;
  padding-right: 62px; /* clear fixed ham-btn */
}
.page-header h1 { font-size: 1.75em; font-weight: 700; color: var(--navy); }

/* ── Buttons ──────────────────────────────────────────────────── */
.btn {
  border: none; border-radius: var(--radius-sm);
  padding: 8px 18px; font-size: .88em; font-weight: 600;
  cursor: pointer; transition: background .15s, transform .1s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--teal); color: #fff; }
.btn-primary:hover { background: #189080; }
.btn-ghost {
  background: var(--white); color: var(--navy);
  border: 1.5px solid var(--border);
}
.btn-ghost:hover { background: var(--bg); }
.btn-amber { background: var(--amber); color: #fff; }
.btn-amber:hover { background: #d9a020; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

/* ── Section ──────────────────────────────────────────────────── */
.section {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  margin-bottom: 24px;
  overflow: hidden;
}
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  cursor: pointer; user-select: none; gap: 10px;
}
.section-header:hover { background: #fafbff; }
.section-title {
  font-weight: 700; font-size: 1.05em; color: var(--navy);
  display: flex; align-items: center; gap: 10px;
}
.section-count {
  background: var(--teal-light); color: var(--teal);
  border-radius: 10px; padding: 2px 10px;
  font-size: .78em; font-weight: 700;
}
.section-chevron {
  font-size: .75em; color: var(--text-muted);
  transition: transform .25s;
}
.section.collapsed .section-chevron { transform: rotate(180deg); }
.section.collapsed .section-body    { display: none; }
.section-body { padding: 8px 0; }

/* ── Skeleton ─────────────────────────────────────────────────── */
.skeleton-row {
  height: 68px; border-radius: 10px; margin: 8px 16px;
  background: linear-gradient(90deg,#f0f2f6 25%,#e8eaee 50%,#f0f2f6 75%);
  background-size: 800px 100%;
  animation: shimmer 1.4s infinite linear;
}

/* ── File row ─────────────────────────────────────────────────── */
.file-list { padding: 4px 0; }
.file-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  transition: background .15s;
  animation: rowIn .2s ease;
}
.file-row:last-child { border-bottom: none; }
.file-row:hover { background: #f8faff; }

.file-icon {
  flex-shrink: 0;
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3em;
  background: var(--teal-light);
}
.file-row.unrecognized .file-icon { background: #fff3e0; }

.file-info { flex: 1; min-width: 0; }
.file-name {
  font-weight: 600; font-size: .93em; color: var(--navy);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.file-meta {
  display: flex; align-items: center; gap: 8px; margin-top: 3px; flex-wrap: wrap;
}
.format-badge {
  background: var(--teal-light); color: var(--teal);
  border-radius: 20px; padding: 2px 10px;
  font-size: .73em; font-weight: 700;
}
.new-badge {
  background: #e8f5e9; color: #2e7d32;
  border-radius: 20px; padding: 2px 10px;
  font-size: .73em; font-weight: 700;
}
.exists-badge {
  background: #f5f5f5; color: #888;
  border-radius: 20px; padding: 2px 10px;
  font-size: .73em; font-weight: 700;
}
.unrec-badge {
  background: #fff3e0; color: #e65100;
  border-radius: 20px; padding: 2px 10px;
  font-size: .73em; font-weight: 700;
}
/* left-edge stripe to distinguish unrecognized rows */
.file-row.unrecognized {
  border-right: 3px solid var(--amber);
  background: #fffdf5;
}
.file-row.recognized { border-right: 3px solid transparent; }

.file-actions { flex-shrink: 0; display: flex; align-items: center; gap: 8px; }

/* ── Parse button states ──────────────────────────────────────── */
.parse-btn { min-width: 72px; }
.parse-btn.parsing {
  background: #f0f2f6; color: var(--text-muted);
  border-color: transparent; cursor: not-allowed; transform: none;
}
.parse-btn.done {
  background: #e8f5e9; color: #2e7d32;
  border-color: #c8e6c9;
}
.parse-btn.failed {
  background: #ffebee; color: var(--red);
  border-color: #ffcdd2;
}
.insert-err-detail {
  margin-top: 6px;
  padding: 8px 12px;
  background: #fff5f5;
  border: 1px solid #fca5a5;
  border-radius: 6px;
  font-size: 0.78em;
  color: #991b1b;
  line-height: 1.6;
  direction: rtl;
}

/* ── Spinner ──────────────────────────────────────────────────── */
.spin-icon {
  width: 14px; height: 14px;
  border: 2px solid rgba(0,0,0,.1);
  border-top-color: var(--teal);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: inline-block; flex-shrink: 0;
}

/* ── Upload zone ──────────────────────────────────────────────── */
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 28px;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  color: var(--text-muted);
  margin: 0 16px 16px;
}
.upload-zone:hover, .upload-zone.drag-over {
  border-color: var(--teal); background: var(--teal-light); color: var(--teal);
}
.upload-zone .upload-icon { font-size: 2em; margin-bottom: 6px; }
.upload-zone .upload-lbl  { font-size: .88em; font-weight: 600; }
.upload-zone .upload-sub  { font-size: .77em; margin-top: 4px; opacity: .8; }
#file-upload-input { display: none; }

/* ── Toast ────────────────────────────────────────────────────── */
.toast-area {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 8px; z-index: 9999;
  pointer-events: none;
}
.toast {
  background: var(--navy); color: #fff;
  border-radius: 10px; padding: 10px 20px;
  font-size: .88em; font-weight: 600;
  box-shadow: var(--shadow-md);
  animation: fadeIn .2s ease;
  pointer-events: auto;
}
.toast.ok  { background: #2e7d32; }
.toast.err { background: var(--red); }

/* ── Process-all summary modal ────────────────────────────────── */
.summary-overlay {
  position: fixed; inset: 0; z-index: 10000;
  background: rgba(30,42,74,.45);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  opacity: 0; pointer-events: none; transition: opacity .18s ease;
}
.summary-overlay.open { opacity: 1; pointer-events: auto; }
.summary-modal {
  background: var(--white); border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  width: min(460px, 100%); max-height: 80vh;
  display: flex; flex-direction: column;
  animation: fadeIn .18s ease;
}
.summary-title {
  font-size: 1.05em; font-weight: 700; color: var(--navy);
  padding: 18px 22px 12px; border-bottom: 1px solid var(--border);
}
.summary-body { padding: 16px 22px; overflow-y: auto; }
.summary-headline {
  font-size: .95em; font-weight: 700; color: var(--green);
  margin-bottom: 6px;
}
.summary-headline.has-fail { color: var(--navy); }
.summary-sec-title {
  font-size: .78em; font-weight: 700; margin: 12px 0 5px;
  text-transform: none; letter-spacing: .02em;
}
.summary-sec-title.err { color: var(--red); }
.summary-sec-title.ok  { color: var(--text-muted); }
.summary-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
.summary-list li {
  display: flex; flex-direction: column; gap: 2px;
  font-size: .84em; padding: 5px 8px;
  background: var(--bg); border-radius: var(--radius-sm);
}
.summary-file   { font-weight: 600; color: var(--navy); word-break: break-all; }
.summary-reason { font-size: .92em; color: var(--red); }
.summary-actions {
  padding: 12px 22px 18px; display: flex; justify-content: flex-end;
  border-top: 1px solid var(--border);
}

/* ── DB-files section ─────────────────────────────────────────── */

/* KPI row */
.db-kpis {
  display: flex; gap: 12px; padding: 16px 20px 14px;
  border-bottom: 1px solid var(--border); flex-wrap: wrap;
}
.db-kpi {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg); border-radius: var(--radius-sm);
  padding: 10px 18px; flex: 0 0 auto;
}
.db-kpi-icon { font-size: 1.3em; flex-shrink: 0; }
.db-kpi-body { display: flex; flex-direction: column; }
.db-kpi-value {
  font-size: 1.45em; font-weight: 700; color: var(--navy);
  line-height: 1.1; font-variant-numeric: tabular-nums;
}
.db-kpi-label { font-size: .72em; color: var(--text-muted); margin-top: 1px; }

/* Format grid (clickable filter cards) */
.db-fmt-grid {
  display: flex; flex-wrap: wrap; gap: 8px;
  padding: 14px 20px; border-bottom: 1px solid var(--border);
}
.db-fmt-btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  padding: 5px 10px; cursor: pointer;
  background: var(--white); transition: all .15s;
  text-align: right; font-family: inherit;
  min-width: 0; width: auto; flex: 0 0 auto;
}
.db-fmt-btn:hover  { border-color: currentColor; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
.db-fmt-btn.active { box-shadow: 0 2px 10px rgba(0,0,0,.10); }
.db-fmt-dot {
  width: 7px; height: 7px; border-radius: 50%;
  flex-shrink: 0; background: currentColor; opacity: .7;
}
.db-fmt-name { font-size: .74em; font-weight: 600; white-space: nowrap; }
.db-fmt-cnt  {
  font-size: .68em; font-weight: 700; opacity: .75;
  background: rgba(0,0,0,.06); border-radius: 20px;
  padding: 1px 6px; white-space: nowrap; font-variant-numeric: tabular-nums;
}
/* "All" button */
.db-fmt-btn.fmt-all { color: var(--text-sub); }
.db-fmt-btn.fmt-all.active { background: var(--navy); border-color: var(--navy); color: #fff; }
/* Per-format colours */
.db-fmt-btn.fmt-bank  { color: #1565c0; }
.db-fmt-btn.fmt-bank.active  { background: #e3f0ff; border-color: #1565c0; }
.db-fmt-btn.fmt-card  { color: var(--teal); }
.db-fmt-btn.fmt-card.active  { background: var(--teal-light); border-color: var(--teal); }
.db-fmt-btn.fmt-amex  { color: #7b1fa2; }
.db-fmt-btn.fmt-amex.active  { background: #f3e8ff; border-color: #7b1fa2; }
.db-fmt-btn.fmt-cal   { color: #e65100; }
.db-fmt-btn.fmt-cal.active   { background: #fff3e0; border-color: #e65100; }
.db-fmt-btn.fmt-max   { color: #2e7d32; }
.db-fmt-btn.fmt-max.active   { background: #e8f5e9; border-color: #2e7d32; }
.db-fmt-btn.fmt-other { color: #555; }
.db-fmt-btn.fmt-other.active { background: #f0f0f0; border-color: #555; }

/* Search bar */
.db-search-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 20px 12px; border-bottom: 1px solid var(--border);
}
.db-search-icon { font-size: 1em; color: var(--text-muted); flex-shrink: 0; }
.db-search {
  flex: 1; padding: 8px 13px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-size: .87em; color: var(--navy); background: var(--bg);
  outline: none; transition: border-color .18s, box-shadow .18s;
  direction: rtl; font-family: inherit;
}
.db-search:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(30,157,139,.1);
}
.db-result-count { font-size: .78em; color: var(--text-muted); white-space: nowrap; }

/* table */
.db-table-wrap { overflow-x: auto; }
.db-table {
  width: 100%; border-collapse: collapse;
  font-size: .855em; min-width: 640px;
}
.db-table thead th {
  text-align: right; padding: 9px 14px;
  font-size: .73em; font-weight: 700;
  color: var(--text-muted); text-transform: uppercase;
  letter-spacing: .5px; border-bottom: 1px solid var(--border);
  white-space: nowrap; cursor: pointer; user-select: none;
  transition: color .12s;
}
.db-table thead th:hover { color: var(--teal); }
.db-table thead th .sort-arrow { margin-right: 3px; opacity: .4; font-size: .85em; }
.db-table thead th.sorted .sort-arrow { opacity: 1; color: var(--teal); }
.db-table tbody tr {
  border-bottom: 1px solid var(--border); transition: background .1s;
  animation: rowIn .15s ease;
}
.db-table tbody tr:last-child { border-bottom: none; }
.db-table tbody tr:hover { background: #f7f9ff; }
.db-table td { padding: 9px 14px; vertical-align: middle; }
.db-fname {
  font-weight: 500; max-width: 260px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--navy);
}
.db-fmt {
  display: inline-block; border-radius: 20px;
  padding: 2px 9px; font-size: .73em; font-weight: 700;
  white-space: nowrap;
}
.fmt-bank   { background: #e3f0ff; color: #1565c0; }
.fmt-card   { background: var(--teal-light); color: var(--teal); }
.fmt-amex   { background: #f3e8ff; color: #7b1fa2; }
.fmt-cal    { background: #fff3e0; color: #e65100; }
.fmt-max    { background: #e8f5e9; color: #2e7d32; }
.fmt-other  { background: #f5f5f5; color: #555; }
.db-card {
  font-variant-numeric: tabular-nums; font-size: .82em;
  color: var(--text-muted); white-space: nowrap;
}
.db-date { color: var(--text-muted); font-size: .82em; white-space: nowrap; }
.db-num  { font-variant-numeric: tabular-nums; text-align: left; white-space: nowrap; }
.db-new  { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: center; }
.db-new.has-new { color: #2e7d32; font-weight: 700; }
.db-new.no-new  { color: var(--text-muted); }

.db-no-results {
  text-align: center; padding: 32px 20px;
  color: var(--text-muted); font-size: .88em;
}

.db-del-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 6px; border: 1px solid #fca5a5;
  background: #fff5f5; color: #dc2626; font-size: .95em; cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
  line-height: 1; padding: 0;
}
.db-del-btn:hover { background: #dc2626; border-color: #dc2626; color: #fff; }

/* ── Scrollbar ────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cdd4e0; border-radius: 3px; }

/* ── Floating log panel ───────────────────────────────────────── */
.log-float {
  position: fixed;
  bottom: 36px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  min-width: 360px; max-width: 520px;
  z-index: 500;
  opacity: 0; pointer-events: none;
  transition: opacity 0.35s ease, transform 0.35s ease;
  text-align: center;
}
.log-float.visible {
  opacity: 1; pointer-events: auto;
  transform: translateX(-50%) translateY(0);
}
.lf-header {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; margin-bottom: 8px;
}
.lf-spinner {
  width: 14px; height: 14px;
  border: 2px solid rgba(30,157,139,0.3);
  border-top-color: #1e9d8b;
  border-radius: 50%;
  animation: lf-spin 0.7s linear infinite; flex-shrink: 0;
}
.lf-spinner.done  { animation: none; border-color: #2ecc71; }
.lf-spinner.error { animation: none; border-color: #f56565; }
@keyframes lf-spin { to { transform: rotate(360deg); } }
.lf-title {
  font-size: 0.8em; font-weight: 600; color: #1e9d8b;
  text-shadow: 0 1px 6px rgba(255,255,255,0.9), 0 0 2px rgba(255,255,255,1);
}
.lf-feed {

// ── State ──────────────────────────────────────────────────────
let _recognized   = [];
let _unrecognized = [];
let _parsing      = false;

// ── Boot ───────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  scanFiles();
  loadDbFiles();
});

// ── Scan ───────────────────────────────────────────────────────
async function scanFiles() {
  const btn = document.getElementById('scan-btn');
  btn.disabled = true;
  showSkeleton('files-list', 3);

  try {
    const res  = await fetch('/api/files/scan');
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'שגיאה');

    _recognized   = data.recognized   || [];
    _unrecognized = data.unrecognized || [];

    renderFiles();
    loadDbFiles();   // the input-folder scan and the DB-files table can both change together (e.g. a file just got inserted and moved out of the input folder) — keep them in sync on every manual refresh
  } catch (e) {
    showError('files-list', e.message);
    toast('שגיאה בסריקה: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

// ── Render all files (recognized + unrecognized) as one list ───
function renderFiles() {
  const list  = document.getElementById('files-list');
  const count = document.getElementById('files-count');
  const total = _recognized.length + _unrecognized.length;
  count.textContent = total;

  const newOnes = _recognized.filter(f => f.is_new);
  const allBtn  = document.getElementById('insert-all-btn');
  allBtn.style.display = newOnes.length > 0 ? '' : 'none';

  if (!total) {
    list.innerHTML = '<div style="padding:24px 20px;color:var(--text-muted);font-size:.88em;text-align:center">תיקיית הקלט ריקה</div>';
    return;
  }

  const recognizedRows = _recognized.map(f => {
    const statusBadge = f.update
      ? '<span class="upd-badge">⟳ קובץ קיים — נמצאה גרסה אחרת' + (f.copy === 'missing' ? ' (אין עותק בארכיון)' : '') + '</span>'
      : f.is_new
      ? '<span class="new-badge">✦ חדש</span>'
      : '<span class="exists-badge">✔ כבר קיים במערכת</span>';
    const parseBtn = f.update
      ? `<button class="btn btn-primary parse-btn" data-fname="${esc(f.name)}" onclick="openCompare(this.dataset.fname)">⇄ השווה ועדכן</button>`
      : f.is_new
      ? `<button class="btn btn-primary parse-btn" id="pbtn-${CSS.escape(f.name)}" data-fname="${esc(f.name)}" onclick="insertFile(this.dataset.fname)">▶ עבד</button>`
      : `<button class="btn btn-ghost parse-btn" disabled title="כבר נמצא בבסיס הנתונים">✓ הוכנס</button>`;
    return `
    <div class="file-row recognized" id="frow-${CSS.escape(f.name)}">
      <div class="file-icon">📄</div>
      <div class="file-info">
        <div class="file-name" title="${esc(f.name)}">${esc(f.name)}</div>
        <div class="file-meta">
          <span class="format-badge">${esc(f.format)}</span>
          ${statusBadge}
        </div>
      </div>
      <div class="file-actions">${parseBtn}</div>
    </div>`;
  });

  const unrecognizedRows = _unrecognized.map(u => {
    const fname   = typeof u === 'string' ? u : u.name;
    const details = typeof u === 'object' && u.details ? u.details : null;
    const detailHtml = details
      ? `<div class="insert-err-detail"><strong>פרטי אי-זיהוי:</strong><br>${esc(details).replace(/; /g, '<br>')}</div>`
      : '';
    return `
    <div class="file-row unrecognized">
      <div class="file-icon">❓</div>
      <div class="file-info">
        <div class="file-name" title="${esc(fname)}">${esc(fname)}</div>
        <div class="file-meta">
          <span class="unrec-badge">⚠ לא מזוהה</span>
        </div>
        ${detailHtml}
      </div>
    </div>`;
  });

  list.innerHTML = [...recognizedRows, ...unrecognizedRows].join('');
}

function showLogFloat(title) {
  document.getElementById('lf-feed').innerHTML = '';
  document.getElementById('lf-title').textContent = title || 'מעבד קובץ…';
  var sp = document.getElementById('lf-spinner');
  sp.className = 'lf-spinner';
  document.getElementById('log-float').classList.add('visible');
}
function hideLogFloat(delay) {
  setTimeout(function() {
    document.getElementById('log-float').classList.remove('visible');
  }, delay || 0);
}
function appendLog(msg, cls) {
  var feed = document.getElementById('lf-feed');
  var el   = document.createElement('div');
  el.className = 'lf-line ' + (cls || _classifyLog(msg));
  el.textContent = msg;
  feed.insertBefore(el, feed.firstChild || null);
  while (feed.children.length > _LF_MAX) { feed.removeChild(feed.lastChild); }
}
function _classifyLog(msg) {
  if (!msg) return '';
  if (msg.indexOf('[ERROR]')   !== -1) return 'err';
  if (msg.indexOf('[WARNING]') !== -1) return 'warn';
  return '';
}

// ── Process one file ──────────────────────────────────────────
// Runs a single file through /api/files/insert with its live log stream,
// flips that file's row button to ✓/✗, and resolves to {filename, ok, reason}.
// Never rejects — a failure is reported through the resolved object.
function _processOneFile(filename) {
  return new Promise((resolve) => {
    const btn = document.getElementById('pbtn-' + CSS.escape(filename));
    if (btn) {
      btn.classList.remove('done', 'failed');
      btn.classList.add('parsing');
      btn.innerHTML = '<span class="spin-icon"></span> מעבד…';
      btn.disabled  = true;
    }

    // Point the floating log panel at this file
    document.getElementById('lf-feed').innerHTML = '';
    document.getElementById('lf-title').textContent = filename;
    const sp = document.getElementById('lf-spinner');
    if (sp) sp.className = 'lf-spinner';
    document.getElementById('log-float').classList.add('visible');

    let lastErr = '';
    let settled = false;
    const es = new EventSource('/api/logs');

    function finish(ok, reason, conflict) {
      if (settled) return;
      settled = true;
      es.close();
      if (ok) {
        if (btn) { btn.classList.remove('parsing'); btn.classList.add('done'); btn.innerHTML = '✓ הוכנס'; }
        appendLog('✓ הקובץ הוכנס בהצלחה', 'done');
        if (sp) sp.className = 'lf-spinner done';
      } else {
        if (btn) { btn.classList.remove('parsing'); btn.classList.add('failed'); btn.innerHTML = '✗ שגיאה'; btn.disabled = false; }
        appendLog('✗ ' + (reason || 'שגיאה בעיבוד הקובץ'), 'err');
        if (sp) sp.className = 'lf-spinner error';
      }
      resolve({ filename: filename, ok: ok, conflict: conflict || null, reason: ok ? '' : (reason || lastErr || 'שגיאה לא ידועה') });
    }

    es.onmessage = function(evt) {
      const data = evt.data;
      if (!data || data === '__CONNECTED__') return;
      if (data.indexOf('__DONE__') === 0) { finish(true); return; }
      if (data.indexOf('__CONFLICT__') === 0) {
        const other = data.slice('__CONFLICT__:'.length);
        finish(false, 'קיים כבר קובץ לאותו כרטיס וחודש: ' + other + ' — השתמשו בהשוואה ועדכון', other);
        return;
      }
      if (data.indexOf('__ERROR__') === 0) {
        finish(false, data.length > '__ERROR__:'.length ? data.slice('__ERROR__:'.length) : '');
        return;
      }
      if (_classifyLog(data) === 'err') lastErr = data.replace('[ERROR]', '').trim();
      appendLog(data);
    };
    es.onerror = function() { finish(false, 'שגיאת חיבור לזרם הלוג'); };

    // Retry the POST a few times if the insert lock is still held by the
    // previous file's worker (its lock release trails the __DONE__ signal).
    let attempt = 0;
    (function post() {
      attempt++;
      fetch('/api/files/insert', {
        method:  'POST',
        headers: {'Content-Type': 'application/json'},
        body:    JSON.stringify({ filename: filename }),
      }).then(r => r.json()).then(data => {
        if (data && data.ok === false) {
          const busy = (data.error || '').indexOf('כבר מתבצע') !== -1;
          if (busy && attempt < 5) { setTimeout(post, 400); return; }
          finish(false, data.error || 'כישלון');
        }
        // otherwise the worker is running — the SSE handler resolves it
      }).catch(e => finish(false, 'שגיאת רשת: ' + e.message));
    })();
  });
}

// ── Insert single file ─────────────────────────────────────────
async function insertFile(filename) {
  if (_parsing) { toast('כבר מתבצע עיבוד', 'err'); return; }
  _parsing = true;
  const r = await _processOneFile(filename);
  _parsing = false;
  if (r.conflict) {
    hideLogFloat(0);
    toast('קיים כבר קובץ לאותו כרטיס וחודש — פותח השוואה', 'ok');
    openCompare(filename, r.conflict);
  } else if (r.ok) {
    toast(`✅ ${filename} הוכנס בהצלחה`, 'ok');
    hideLogFloat(2000);
    setTimeout(scanFiles, 1200);
  } else {
    toast('שגיאה בעיבוד הקובץ: ' + r.reason, 'err');
    hideLogFloat(3500);
  }
}

// ── Insert all new files ───────────────────────────────────────
async function insertAll() {
  if (_parsing) { toast('כבר מתבצע עיבוד', 'err'); return; }
  const newOnes = _recognized.filter(f => f.is_new);
  if (!newOnes.length) { toast('אין קבצים חדשים לעיבוד'); return; }

  _parsing = true;
  const allBtn = document.getElementById('insert-all-btn');
  allBtn.disabled  = true;

  // Mark every new-file button as queued
  newOnes.forEach(f => {
    const btn = document.getElementById('pbtn-' + CSS.escape(f.name));
    if (btn) {
      btn.classList.remove('done', 'failed');
      btn.classList.add('parsing');
      btn.innerHTML = '<span class="spin-icon"></span>';
      btn.disabled  = true;
    }
  });

  const results = [];
  for (let i = 0; i < newOnes.length; i++) {
    allBtn.innerHTML = `<span class="spin-icon"></span> מעבד ${i + 1}/${newOnes.length}…`;
    results.push(await _processOneFile(newOnes[i].name));
  }

  _parsing = false;
  allBtn.disabled  = false;
  allBtn.innerHTML = '▶ עבד את כולם';
  hideLogFloat(600);
  showProcessSummary(results);
}

// ── Process-all summary modal ─────────────────────────────────
function showProcessSummary(results) {
  const total    = results.length;
  const okList   = results.filter(r => r.ok);
  const failList = results.filter(r => !r.ok);

  let html = `<div class="summary-headline${failList.length ? ' has-fail' : ''}">` +
    `${okList.length} מתוך ${total} קבצים עובדו בהצלחה</div>`;

  if (failList.length) {
    html += `<div class="summary-sec-title err">נכשלו (${failList.length}):</div>` +
      '<ul class="summary-list">' + failList.map(r =>
        `<li><span class="summary-file">✗ ${esc(r.filename)}</span>` +
        `<span class="summary-reason">${esc(r.reason || 'שגיאה לא ידועה')}</span></li>`
      ).join('') + '</ul>';
  }
  if (okList.length) {
    html += `<div class="summary-sec-title ok">הוכנסו (${okList.length}):</div>` +
      '<ul class="summary-list">' + okList.map(r =>
        `<li><span class="summary-file">✓ ${esc(r.filename)}</span></li>`
      ).join('') + '</ul>';
  }

  document.getElementById('summary-body').innerHTML = html;
  document.getElementById('summary-overlay').classList.add('open');
}
function closeProcessSummary() {
  document.getElementById('summary-overlay').classList.remove('open');
  scanFiles();   // back to the folder listing
}

// ── Updated files: compare a newer download with the stored file ─
let _cmp = null;   // { filename, existing, report }

/** The update history of a stored file, one line per update: which file it was before and what changed. */
function updateHistoryRow(f) {
  const h = f.history || [];
  if (!h.length) return '';
  const lines = h.map(u => {
    const when = u.at.slice(8, 10) + '.' + u.at.slice(5, 7) + '.' + u.at.slice(2, 4) + ' ' + u.at.slice(11);
    const old = `<b>${esc(u.old_name)}</b> (${u.old_rows} פעולות${u.old_tagged ? `, ${u.old_tagged} מתויגות` : ''}` +
      `${u.old_saved_on ? `, הוכנס ${esc(_fmtDate(u.old_saved_on))}` : ''})`;
    const parts = [];
    if (u.added)   parts.push(`<span class="add">+${u.added} חדשות</span>`);
    if (u.changed) parts.push(`${u.changed} תוקנו`);
    if (u.removed) parts.push(`<span class="rem">${u.removed} הוסרו</span>`);
    const diff = parts.length ? parts.join(' · ') : 'ללא שינוי בפעולות';
    const trash = u.trashed ? ' · הקובץ הקודם בפח' : '';
    return u.kind === 'replace'
      ? `<div>⟳ ${esc(when)} · הוחלף: ${old} נמחק והקובץ החדש הוכנס מחדש (${u.new_rows} פעולות)${trash}</div>`
      : `<div>⟳ ${esc(when)} · עודכן על גבי ${old} → ${u.new_rows} פעולות · ${diff}${trash}</div>`;
  });
  return `<tr class="hist-row"><td colspan="8"><div class="upd-hist">${lines.join('')}</div></td></tr>`;
}

function updatedBadge(f) {
  const u = f.updated;
  if (!u) return '';
  const parts = [];
  if (u.added)   parts.push('נוספו ' + u.added);
  if (u.changed) parts.push('תוקנו ' + u.changed);
  if (u.removed) parts.push('הוסרו ' + u.removed);
  const what = u.kind === 'replace' ? 'הוחלף בקובץ חדש' : 'עודכן על גבי קובץ קיים';
  const tip = what + ' · ' + u.at + (parts.length ? ' · ' + parts.join(' · ') : '');
  return `<span class="upd-done" title="${esc(tip)}">⟳ ${u.kind === 'replace' ? 'הוחלף' : 'עודכן'}</span>`;
}

function _fmtAmt(v) {
  if (v === null || v === undefined || v === '') return '';
  return (+v).toLocaleString('he-IL', { maximumFractionDigits: 2 });
}
function _fmtDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  return m ? `${m[3]}.${m[2]}.${m[1].slice(2)}` : (iso || '');
}

function closeCompare() {
  document.getElementById('cmp-overlay').classList.remove('open');
  _cmp = null;
}

async function openCompare(filename, existing) {
  _cmp = { filename, existing: existing || null, report: null };
  document.getElementById('cmp-sub').textContent = filename;
  document.getElementById('cmp-body').innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted)">קורא את הקובץ ומשווה לנתונים הקיימים…</div>';
  document.getElementById('cmp-actions').innerHTML = '<div class="cmp-foot"><button class="btn btn-ghost" onclick="closeCompare()">ביטול</button></div>';
  document.getElementById('cmp-overlay').classList.add('open');
  try {
    const res  = await fetch('/api/files/analyze', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ filename, existing: existing || null })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'שגיאה');
    _cmp.report = data.report;
    renderCompare(data.report);
  } catch (e) {
    document.getElementById('cmp-body').innerHTML = `<div class="cmp-warn">${esc(e.message)}</div>`;
  }
}

const _CMP_NOTE = {
  identical:        'כל הפעולות בקובץ החדש כבר קיימות במערכת, ללא שינוי.',
  new_transactions: 'הקובץ החדש כולל פעולות שאינן קיימות במערכת. כל הפעולות הקיימות נשארו כפי שהיו.',
  missing_rows:     'בקובץ החדש חסרות פעולות שקיימות כרגע במערכת. קובץ מעודכן אמור רק להוסיף פעולות — זה מצביע על שינוי לא צפוי או תקלה. מומלץ לתחקר לפני כל החלטה.',
  other:            'יש בקובץ החדש הבדלים ביחס לקיים (פעולות ששונו, או קובץ של כרטיס / חודש אחר) — כדאי לעבור על הפירוט.',
};

function _rowsList(items, withWork) {
  return items.map(r => `<div class="cmp-row"><span>${esc(_fmtDate(r.date))}</span><span>${esc(r.name)}${
    r.fields ? ` <span class="tag">(שונה: ${esc(r.fields.join(', '))})</span>` : ''}${
    withWork && r.work ? ` <span class="tag">· יישמר (${esc(r.category && r.category !== 'NotCategorized' ? r.category : 'עם עבודה')})</span>` : ''
  }</span><span class="amt">${esc(_fmtAmt(r.amount))}${r.old_amount !== undefined && r.old_amount !== null ? ` (היה ${esc(_fmtAmt(r.old_amount))})` : ''}</span></div>`).join('');
}

const _LINK_LABELS = { split: 'פיצול', timeline: 'ציר זמן', bill: 'מעקב חשבונות', recurring: 'חיובים חוזרים',
                       division: 'חלוקת בנק/כרטיס', spotify: 'Spotify', housing: 'דיור' };
const _SIM_FIELDS  = { name: 'שם', date: 'תאריך', amount: 'סכום' };

function _bytes(n) { return n == null ? '—' : (n >= 1024 ? (n / 1024).toFixed(1) + ' KB' : n + ' B'); }

function _investigationHtml(inv, r) {
  const f = inv.files, row = (label, a, b) => `<tr><td>${label}</td><td class="num">${esc(a)}</td><td class="num">${esc(b)}</td></tr>`;
  const rng = x => x.first_date ? `${_fmtDate(x.first_date)} – ${_fmtDate(x.last_date)}` : '—';
  const facts = `<table class="cmp-table cmp-facts"><thead><tr><th></th><th>קובץ קיים</th><th>קובץ חדש</th></tr></thead><tbody>` +
    row('שם', f.stored.name, f.new.name) +
    row('פעולות', f.stored.rows, f.new.rows) +
    row('טווח תאריכי רכישה', rng(f.stored), rng(f.new)) +
    row('סכום חיוב כולל (₪, מעוגל)', _fmtAmt(f.stored.total), _fmtAmt(f.new.total)) +
    row('גודל הקובץ', f.stored.file ? _bytes(f.stored.file.size) : 'אין עותק בארכיון', f.new.file ? _bytes(f.new.file.size) : '—') +
    row('נשמר בדיסק', f.stored.file ? f.stored.file.modified : '—', f.new.file ? f.new.file.modified : '—') +
    row('הוכנס למערכת', f.stored.saved_on || '—', '—') +
    (f.stored.updated_at ? row('עודכן בעבר', f.stored.updated_at, '—') : '') + '</tbody></table>';

  const hints = inv.hints.length ? '<ul class="cmp-hints">' + inv.hints.map(h => `<li>${esc(h)}</li>`).join('') + '</ul>' : '';

  const gone = inv.missing.map(m => {
    const links = m.links.length ? m.links.map(k => _LINK_LABELS[k] || k).join(', ') : '';
    const cat = m.category && m.category !== 'NotCategorized' ? m.category : '';
    const sims = m.similar.map(s => `<div class="sim">נראה דומה לפעולה #${s.new_position} בקובץ החדש: ${esc(s.name)} · ${esc(_fmtDate(s.date))} · ${esc(_fmtAmt(s.amount))} — זהה ב${s.same.map(x => _SIM_FIELDS[x]).join(' וב')}, שונה ב${s.differs.map(x => _SIM_FIELDS[x]).join(' וב')}</div>`).join('');
    return `<div class="cmp-gone">
      <div class="cmp-gone-head"><span>#${m.position} · ${esc(m.name)}</span><span class="amt">${esc(_fmtAmt(m.amount))} ${esc(m.currency || '')}</span></div>
      <div class="cmp-gone-grid">
        <span>תאריך רכישה</span><b>${esc(_fmtDate(m.executed_date))}</b>
        <span>תאריך חיוב</span><b>${esc(_fmtDate(m.charge_date) || '—')}</b>
        ${m.transaction_value !== m.amount ? `<span>סכום עסקה</span><b>${esc(_fmtAmt(m.transaction_value))} ${esc(m.value_currency || '')}</b>` : ''}
        <span>מס' שובר</span><b>${esc(m.serial || '—')}</b>
        <span>מידע נוסף</span><b>${esc(m.extra_info || '—')}</b>
        <span>מזהה במערכת</span><b>${m.id}</b>
        <span>קטגוריה</span><b>${cat ? `<span class="work">${esc(cat)}</span>` : 'לא מתויג'}</b>
        ${m.description ? `<span>תיאור</span><b class="work">${esc(m.description)}</b>` : ''}
        ${links ? `<span>מקושר ל</span><b class="work">${esc(links)}</b>` : ''}
      </div>${sims}</div>`;
  }).join('');
  const more = inv.missing_total > inv.missing.length ? `<div class="cmp-sub">ועוד ${inv.missing_total - inv.missing.length} פעולות…</div>` : '';

  return `<div class="cmp-inv">
    <h4>פרטי התחקור — ${inv.missing_total} פעולות חסרות (${esc(_fmtAmt(inv.missing_amount))}₪)</h4>
    ${hints}
    <div><div class="cmp-sec">הקבצים</div>${facts}</div>
    <div><div class="cmp-sec">הפעולות שחסרות בקובץ החדש</div>${gone}${more}</div>
  </div>`;
}

function _investigationText(r) {
  const inv = r.investigation, f = inv.files;
  const L = [`דוח תחקור — ${r.new.name} מול ${r.existing.name}`, `סטטוס: ${r.status_label}`, '',
    `קובץ קיים: ${f.stored.rows} פעולות, ${f.stored.first_date || '—'} – ${f.stored.last_date || '—'}, סכום ${f.stored.total}₪` + (f.stored.file ? `, ${_bytes(f.stored.file.size)}, נשמר ${f.stored.file.modified}` : ', אין עותק בארכיון'),
    `קובץ חדש: ${f.new.rows} פעולות, ${f.new.first_date || '—'} – ${f.new.last_date || '—'}, סכום ${f.new.total}₪` + (f.new.file ? `, ${_bytes(f.new.file.size)}, נשמר ${f.new.file.modified}` : ''),
    '', 'תובנות:', ...inv.hints.map(h => '- ' + h), '', `פעולות חסרות (${inv.missing_total}):`];
  inv.missing.forEach(m => {
    L.push(`#${m.position} id=${m.id} | ${m.executed_date} | ${m.name} | ${m.amount} ${m.currency || ''} | חיוב ${m.charge_date || '—'} | שובר ${m.serial || '—'} | ${m.extra_info}` +
      ` | קטגוריה: ${m.category || '—'}` + (m.description ? ` | תיאור: ${m.description}` : '') + (m.links.length ? ` | מקושר: ${m.links.join(',')}` : ''));
    m.similar.forEach(s => L.push(`    דומה ל־#${s.new_position} בחדש: ${s.name} | ${s.date} | ${s.amount} (שונה: ${s.differs.join(',')})`));
  });
  return L.join('\n');
}

async function copyInvestigation() {
  if (!_cmp || !_cmp.report || !_cmp.report.investigation) return;
  try { await navigator.clipboard.writeText(_investigationText(_cmp.report)); toast('דוח התחקור הועתק ללוח', 'ok'); }
  catch (e) { toast('ההעתקה נכשלה', 'err'); }
}

function renderCompare(r) {
  const c = r.counts;
  const kpi = (n, label, cls) => `<div class="cmp-kpi ${cls || ''}"><b>${(+n).toLocaleString('he-IL')}</b><span>${label}</span></div>`;
  let html = `<div class="cmp-status ${esc(r.status)}"><div>${esc(r.status_label)}<small>${esc(_CMP_NOTE[r.status] || '')}</small></div></div>`;
  html += '<div class="cmp-kpis">' +
    kpi(c.existing_rows, 'פעולות בקובץ הקיים') + kpi(c.new_rows, 'פעולות בקובץ החדש') +
    kpi(c.same, 'זהות') + kpi(c.added, 'פעולות חדשות', 'add') + kpi(c.removed, 'חסרות בחדש', 'rem') +
    kpi(c.changed, 'שונו', 'chg') + (c.moved ? kpi(c.moved, 'במיקום שונה', 'chg') : '') +
    kpi(c.tagged_existing, 'מתויגות בקיים') + '</div>';
  if (r.warnings.length) html += '<div class="cmp-warn">' + r.warnings.map(w => `<div>⚠ ${esc(w)}</div>`).join('') + '</div>';

  html += `<div><div class="cmp-sec">מבנה הקובץ</div><table class="cmp-table"><thead><tr><th></th><th>קובץ קיים<br>${esc(r.existing.name)}</th><th>קובץ חדש<br>${esc(r.new.name)}</th><th></th></tr></thead><tbody>` +
    r.structure.map(s => `<tr class="${s.changed ? 'changed' : ''}"><td>${esc(s.label)}</td><td class="num">${esc(Array.isArray(s.old) ? s.old.join(', ') : String(s.old))}</td><td class="num">${esc(Array.isArray(s.new) ? s.new.join(', ') : String(s.new))}</td><td>${s.changed ? '⚠' : '✓'}</td></tr>`).join('') +
    '</tbody></table></div>';

  const det = (title, items, total, withWork) => items.length
    ? `<details class="cmp-det"${items.length <= 8 ? ' open' : ''}><summary>${title} (${total})</summary><div class="cmp-rows">${_rowsList(items, withWork)}</div>${total > items.length ? `<div class="cmp-row"><span></span><span>ועוד ${total - items.length}…</span><span></span></div>` : ''}</details>` : '';
  html += det('פעולות חדשות', r.added, c.added, false) + det('פעולות ששונו', r.changed, c.changed, false);
  if (r.investigation) html += _investigationHtml(r.investigation, r);
  document.getElementById('cmp-body').innerHTML = html;

  const canUpd = r.can_update;
  const updNote = !r.identity_ok ? 'לא ניתן לעדכן: הקובץ החדש אינו של אותו כרטיס וחודש.'
    : r.status === 'missing_rows' ? 'לא ניתן לעדכן כל עוד חסרות בקובץ החדש פעולות שקיימות במערכת. יש לתחקר את הסיבה (ראו פרטי התחקור).'
    : (r.status === 'identical' && !canUpd) ? 'הקובץ זהה לחלוטין — אין מה לעדכן.'
    : 'הפעולות הקיימות נשארות עם הקטגוריות והתיאורים שלהן, ונוספות רק הפעולות החדשות. הקובץ הישן יעבור לפח.';
  document.getElementById('cmp-actions').innerHTML = `
    <div class="cmp-choices">
      <div class="cmp-choice">
        <button class="btn btn-primary" id="cmp-update-btn" ${canUpd ? '' : 'disabled'} onclick="applyUpdate('update')">⟳ עדכן ושמור את העבודה</button>
        <p>${esc(updNote)}</p>
      </div>
      <div class="cmp-choice">
        <button class="btn btn-danger-soft" id="cmp-replace-btn" onclick="applyUpdate('replace')">⚠ דרוס לחלוטין</button>
        <p>כל הפעולות של הקובץ הקיים יימחקו — כולל קטגוריות, תיאורים ופיצולים — והקובץ החדש יוכנס מחדש. הקובץ הישן יעבור לפח.</p>
      </div>
    </div>
    <div class="cmp-foot"><button class="btn btn-ghost" onclick="closeCompare()">ביטול</button>${
      r.investigation ? '<button class="btn btn-ghost" onclick="copyInvestigation()">📋 העתק דוח תחקור</button>' : ''}</div>`;
}

async function applyUpdate(mode) {
  if (!_cmp || !_cmp.report) return;
  const r = _cmp.report, c = r.counts;
  const msg = mode === 'replace'
    ? `לדרוס את "${r.existing.name}" לחלוטין?\n\n${c.existing_rows} פעולות קיימות (${c.tagged_existing} מתויגות) יימחקו עם הקטגוריות והתיאורים שלהן, והקובץ החדש (${c.new_rows} פעולות) יוכנס מחדש.` +
      (r.investigation ? `\n\nשימו לב: ${c.removed} מהפעולות הקיימות לא נמצאות בקובץ החדש (${r.investigation.work.tagged} מתויגות, ${r.investigation.work.linked} מקושרות לתכונות אחרות). מומלץ לתחקר לפני הדריסה.` : '') + `\n\nהפעולה אינה הפיכה.`
    : `לעדכן את "${r.existing.name}" בקובץ החדש?\n\nיתווספו ${c.added} פעולות${c.changed ? `, יתוקנו ${c.changed}` : ''}. כל הפעולות הקיימות, הקטגוריות והתיאורים נשמרים.`;
  if (!confirm(msg)) return;
  const btns = ['cmp-update-btn', 'cmp-replace-btn'].map(id => document.getElementById(id));
  btns.forEach(b => { if (b) b.disabled = true; });
  const active = document.getElementById(mode === 'replace' ? 'cmp-replace-btn' : 'cmp-update-btn');
  if (active) active.innerHTML = '<span class="spin-icon"></span> מעדכן…';
  try {
    const res  = await fetch('/api/files/apply-update', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ filename: _cmp.filename, existing: _cmp.existing, mode })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'שגיאה');
    const n = data.counts;
    toast(`✅ ${mode === 'replace' ? 'הקובץ הוחלף' : 'הקובץ עודכן'} · נוספו ${n.added}${n.changed ? ` · תוקנו ${n.changed}` : ''}${n.removed ? ` · הוסרו ${n.removed}` : ''}`, 'ok');
    (data.warnings || []).forEach(w => toast('⚠ ' + w, 'err'));
    closeCompare();
    scanFiles();
  } catch (e) {
    toast('העדכון נכשל: ' + e.message, 'err');
    btns.forEach(b => { if (b) b.disabled = false; });
    renderCompare(r);
  }
}

// ── Upload ──────────────────────────────────────────────────────
function openUpload() {
  document.getElementById('file-upload-input').click();
}

async function handleFileUpload(files) {
  if (!files || !files.length) return;
  const fileArr = Array.from(files);
  let uploaded = 0;

  for (const file of fileArr) {
    const fd = new FormData();
    fd.append('file', file);
    try {
      const res  = await fetch('/api/files/upload', {method:'POST', body: fd});
      const data = await res.json();
      if (data.ok) { uploaded++; }
      else         { toast('שגיאה בהעלאת ' + file.name + ': ' + data.error, 'err'); }
    } catch (e) {
      toast('שגיאת רשת בהעלאה: ' + e.message, 'err');
    }
  }

  if (uploaded > 0) {
    toast(`✅ ${uploaded} קבצים הועלו — סורק מחדש…`, 'ok');
    document.getElementById('file-upload-input').value = '';
    setTimeout(scanFiles, 600);
  }
}

// ── Drag & drop ────────────────────────────────────────────────
function onDragOver(e) {
  e.preventDefault();
  document.getElementById('upload-zone').classList.add('drag-over');
}
function onDragLeave(e) {
  document.getElementById('upload-zone').classList.remove('drag-over');
}
function onDrop(e) {
  e.preventDefault();
  document.getElementById('upload-zone').classList.remove('drag-over');
  const files = e.dataTransfer.files;
  if (files && files.length) handleFileUpload(files);
}

// ── DB-Files section ───────────────────────────────────────────
let _dbLoaded = false;
let _dbFiles  = [];
let _dbSort   = { col: 'date', dir: -1 };
let _dbFmt    = new Set();  // empty = all formats; otherwise one or more selected formats

const _FMT_CLASS = {
  'BeinLeumi-Bank':            'fmt-bank',
  'BeinLeumi-Bank-Date-Range': 'fmt-bank',
  'American-Express':          'fmt-amex',
  'Cal':                       'fmt-cal',
  'Leumi-Max':                 'fmt-max',
  'Isra-Card':                 'fmt-card',
  'Isra-Card-2026':            'fmt-card',
};
function _fmtClass(fmt) { return _FMT_CLASS[fmt] || 'fmt-other'; }

// Human-readable short label for format
const _FMT_LABEL = {
  'BeinLeumi-Bank':            'בינלאומי',
  'BeinLeumi-Bank-Date-Range': 'בינלאומי (טווח)',
  'American-Express':          'אמריקן אקספרס',
  'Cal':                       'Cal',
  'Leumi-Max':                 'לאומי Max',
  'Isra-Card':                 'ישראכארט',
  'Isra-Card-2026':            'ישראכארט 2026',
};
function _fmtLabel(fmt) { return _FMT_LABEL[fmt] || fmt; }

async function loadDbFiles() {
  _dbLoaded = true;
  const _ctrl = new AbortController();
  const _timeout = setTimeout(() => _ctrl.abort(), 20000);
  try {
    const res  = await fetch('/api/files/db-files', {signal: _ctrl.signal});
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'שגיאה');
    _dbFiles = data.files || [];

    const totalTx = data.total_transactions || 0;
    document.getElementById('db-stat-files').textContent = _dbFiles.length.toLocaleString('he-IL');
    document.getElementById('db-stat-tx').textContent    = totalTx.toLocaleString('he-IL');
    document.getElementById('db-files-count').textContent = _dbFiles.length;

    // Build format counts & filter buttons
    const fmtCounts = {};
    _dbFiles.forEach(f => { fmtCounts[f.format] = (fmtCounts[f.format] || 0) + 1; });
    const sortedFmts = Object.entries(fmtCounts).sort((a,b) => b[1]-a[1]);

    const grid = document.getElementById('db-fmt-grid');
    grid.innerHTML =
      `<button class="db-fmt-btn fmt-all active" data-fmt="" onclick="setDbFmt(this,'')">
         <span class="db-fmt-name">הכל</span>
         <span class="db-fmt-cnt">${_dbFiles.length}</span>
       </button>` +
      sortedFmts.map(([fmt, cnt]) =>
        `<button class="db-fmt-btn ${_fmtClass(fmt)}" data-fmt="${esc(fmt)}" onclick="setDbFmt(this,'${esc(fmt)}')">
           <span class="db-fmt-dot"></span>
           <span class="db-fmt-name">${esc(_fmtLabel(fmt))}</span>
           <span class="db-fmt-cnt">${cnt}</span>
         </button>`
      ).join('');

    document.getElementById('db-kpis').style.display      = '';
    document.getElementById('db-fmt-grid').style.display  = '';
    document.getElementById('db-search-row').style.display = '';

    renderDbTable();
  } catch (e) {
    _dbLoaded = false;  // allow retry — don't get stuck until a full page reload
    const msg = e.name === 'AbortError' ? 'תם הזמן הקצוב לטעינה' : e.message;
    document.getElementById('db-files-body').innerHTML =
      `<div class="db-no-results">⚠ שגיאה בטעינה: ${esc(msg)}
         <button onclick="loadDbFiles()" style="margin-inline-start:8px">נסה שוב</button>
       </div>`;
  } finally {
    clearTimeout(_timeout);
  }
}

function setDbFmt(el, fmt) {
  if (!fmt) {
    _dbFmt.clear();
  } else if (_dbFmt.has(fmt)) {
    _dbFmt.delete(fmt);
  } else {
    _dbFmt.add(fmt);
  }
  document.querySelectorAll('#db-fmt-grid .db-fmt-btn').forEach(p => {
    p.classList.toggle('active', p.dataset.fmt ? _dbFmt.has(p.dataset.fmt) : _dbFmt.size === 0);
  });
  renderDbTable();
}

function sortDb(col) {
  if (_dbSort.col === col) { _dbSort.dir *= -1; }
  else { _dbSort.col = col; _dbSort.dir = (col === 'date' || col === 'last_update') ? -1 : 1; }
  renderDbTable();
}

function renderDbTable() {
  const q   = (document.getElementById('db-search').value || '').trim().toLowerCase();
  const dir = _dbSort.dir;
  const col = _dbSort.col;

  let rows = _dbFiles.filter(f => {
    if (_dbFmt.size && !_dbFmt.has(f.format)) return false;
    if (q && !f.name.toLowerCase().includes(q)) return false;
    return true;
  });

  rows.sort((a, b) => {
    let va = a[col] ?? '', vb = b[col] ?? '';
    if (col === 'transaction_count' || col === 'new_transactions') { va = +va; vb = +vb; }
    if (va < vb) return -dir;
    if (va > vb) return dir;
    return 0;
  });

  const cntEl = document.getElementById('db-result-count');
  if (cntEl) cntEl.textContent = rows.length !== _dbFiles.length ? `${rows.length} מתוך ${_dbFiles.length}` : `${rows.length} קבצים`;

  if (!rows.length) {
    document.getElementById('db-files-body').innerHTML =
      '<div class="db-no-results">לא נמצאו קבצים תואמים</div>';
    return;
  }

  const arrowHtml = c => {
    const active = (_dbSort.col === c);
    const sym = active ? (_dbSort.dir === 1 ? '▲' : '▼') : '⇅';
    return `<span class="sort-arrow">${sym}</span>`;
  };

  const thead = `<thead><tr>
    <th onclick="sortDb('name')">שם קובץ ${arrowHtml('name')}</th>
    <th onclick="sortDb('format')">מקור ${arrowHtml('format')}</th>
    <th onclick="sortDb('card')">כרטיס ${arrowHtml('card')}</th>
    <th onclick="sortDb('date')">תאריך ${arrowHtml('date')}</th>
    <th onclick="sortDb('transaction_count')">סה"כ עסקאות שזוהו ${arrowHtml('transaction_count')}</th>
    <th onclick="sortDb('new_transactions')" style="text-align:center">עסקאות חדשות ${arrowHtml('new_transactions')}</th>
    <th onclick="sortDb('last_update')">עדכון אחרון ${arrowHtml('last_update')}</th>
    <th style="width:42px"></th>
  </tr></thead>`;

  const tbody = '<tbody>' + rows.map(f => {
    const card   = f.card
      ? `<span style="font-variant-numeric:tabular-nums;font-size:.82em">${esc(f.card)}</span>`
      : `<span class="db-fmt fmt-bank" style="font-size:.7em;padding:1px 7px">בנק</span>`;
    const newCls = f.new_transactions > 0 ? 'db-new has-new' : 'db-new no-new';
    const newTxt = f.new_transactions > 0 ? `+${f.new_transactions}` : '—';
    const cardAttr = esc(f.card || '');
    return `<tr>
      <td class="db-fname" title="${esc(f.name)}">${esc(f.name)}${updatedBadge(f)}</td>
      <td><span class="db-fmt ${_fmtClass(f.format)}">${esc(_fmtLabel(f.format))}</span></td>
      <td class="db-card">${card}</td>
      <td class="db-date">${f.date || '—'}</td>
      <td class="db-num">${(+f.transaction_count).toLocaleString('he-IL')}</td>
      <td class="${newCls}">${newTxt}</td>
      <td class="db-date">${f.last_update || '—'}</td>
      <td style="text-align:center;padding:6px 8px">
        <button class="db-del-btn" title="מחק קובץ"
          onclick="deleteDbFile(${JSON.stringify(f.name).replace(/"/g,'&quot;')},${JSON.stringify(f.format).replace(/"/g,'&quot;')},${JSON.stringify(f.card||'').replace(/"/g,'&quot;')})">🗑</button>
      </td>
    </tr>${updateHistoryRow(f)}`;
  }).join('') + '</tbody>';

  document.getElementById('db-files-body').innerHTML =
    `<table class="db-table">${thead}${tbody}</table>`;

  // highlight active sort column
  document.querySelectorAll('.db-table thead th').forEach(th => th.classList.remove('sorted'));
  const cols = ['name','format','card','date','transaction_count','new_transactions','last_update'];
  const ths  = document.querySelectorAll('.db-table thead th');
  if (ths[cols.indexOf(_dbSort.col)]) ths[cols.indexOf(_dbSort.col)].classList.add('sorted');
}

// ── Delete DB file ─────────────────────────────────────────────
function deleteDbFile(name, format, card) {
  const label = name + (card ? ` (${card})` : '');
  if (!confirm(`למחוק את הקובץ "${label}" ואת כל עסקאותיו מהמאגר?\n\nפעולה זו אינה הפיכה.`)) return;
  fetch('/api/files/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, format, card })
  })
  .then(r => r.json())
  .then(d => {
    if (d.ok) {
      toast('הקובץ נמחק בהצלחה', 'ok');
      loadDbFiles();          // refresh the table
    } else {
      toast('שגיאה במחיקה: ' + (d.error || 'unknown'), 'err');
    }
  })
  .catch(() => toast('שגיאת רשת בעת המחיקה', 'err'));
}

// ── Helpers ────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showSkeleton(listId, n) {
  const el = document.getElementById(listId);
  if (el) el.innerHTML = Array(n).fill('<div class="skeleton-row"></div>').join('');
}

function showError(listId, msg) {
  const el = document.getElementById(listId);
  if (!el) return;
  if (!msg) { el.innerHTML = ''; return; }
  el.innerHTML = `<div style="padding:16px 20px;color:var(--red);font-size:.88em">⚠ ${esc(msg)}</div>`;
}

function toast(msg, type) {
  const area = document.getElementById('toast-area');
  const el   = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  area.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
</script>
<div class="files-regen-fab">
  <button class="files-regen-btn" id="scan-btn" onclick="scanFiles()" title="רענן">
    <span class="files-regen-icon">&#8635;</span>
    <span class="files-regen-label">רענן</span>
  </button>
</div>
<button class="debug-fab" id="debug-fab" onclick="toggleDebugPanel()" title="App logs">&lt;/&gt;</button>
<div class="debug-panel" id="debug-panel">
  <div class="debug-hdr"><span>&#9658; app logs</span><div class="debug-hdr-btns"><button onclick="copyDebugPanel()">copy</button><button onclick="clearDebugPanel()">clear</button><button onclick="toggleDebugPanel()">&#x2715;</button></div></div>
  <div class="debug-feed" id="debug-feed"></div>
</div>
<script>
var _dbgEs=null;
function toggleDebugPanel(){var p=document.getElementById('debug-panel');var open=p.classList.toggle('open');if(open&&!_dbgEs)_startDebugStream()}
function _startDebugStream(){if(_dbgEs)return;_dbgEs=new EventSource('/api/debug-logs');_dbgEs.onmessage=function(e){if(!e.data||!e.data.trim())return;var f=document.getElementById('debug-feed');if(!f)return;var d=document.createElement('div');d.className='debug-line'+(e.data.toLowerCase().indexOf('error')>=0?' err':e.data.toLowerCase().indexOf('warn')>=0?' warn':'');d.textContent=e.data;f.appendChild(d);f.scrollTop=f.scrollHeight};_dbgEs.onerror=function(){if(_dbgEs){_dbgEs.close();_dbgEs=null}setTimeout(_startDebugStream,4000)}}
// Delayed, not immediate: /api/debug-logs is a true never-returning SSE
// stream, and starting it in the same instant as scanFiles()/loadDbFiles()
// can starve those requests of a serverless execution slot until Vercel
// kills the stream's invocation — looking like an infinite hang on first
// load. The server buffers log lines regardless of client connection
// (_debug_buffer, replayed on connect), so delaying costs no history.
document.addEventListener('DOMContentLoaded',function(){setTimeout(_startDebugStream,3000)});
function clearDebugPanel(){document.getElementById('debug-feed').innerHTML=''}
function copyDebugPanel(){var f=document.getElementById('debug-feed');navigator.clipboard.writeText(Array.from(f.children).map(function(e){return e.textContent}).join('\n')).catch(function(){})}
</script>
